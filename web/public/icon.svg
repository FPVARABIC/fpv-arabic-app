<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FPVARABIC">
  <!--
    The FPVARABIC mark.

    The gradient is the product's own action gradient — #18E6E6 → #00B4FF, the
    same two stops the phone app uses for every primary button and the web uses
    for the header tile. It used to be a blue/indigo pair that appears nowhere
    else in the product, which meant the browser tab was the one surface showing
    a colour the platform does not own.

    Drawn rather than photographed, and deliberately so: this is our own mark,
    not a product, so none of the sourcing rules that govern product imagery
    apply to it.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18E6E6"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="19" fill="url(#g)"/>
  <path d="M23 17h20v7.5H30.5v7H41v7.5H30.5V47H23z" fill="#04101e"/>
</svg>
