definition:
  text: >
    Motor Test هو وظيفة داخل الـ Firmware تسمح بإرسال أوامر مباشرة إلى
    المحركات لفهم سلوك منظومة الدفع واستجابة مخرجات متحكم الطيران.
  textEn: >
    Motor Test is a firmware function that allows direct motor output to
    understand propulsion-system behavior and Flight Controller motor output.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يوفر الـ Firmware وظيفة تسمى Motor Test لفهم العلاقة بين أوامر متحكم
    الطيران واستجابة المحركات. يقتصر هذا المفهوم على تفسير الغرض من هذه
    الوظيفة، ولا يشرح كيفية استخدامها أو تنفيذها عملياً، لأن ذلك ينتمي
    إلى مفاهيم السلامة والإجراءات.
  textEn: >
    Firmware provides a Motor Test function to understand the relationship
    between Flight Controller commands and motor response. This concept
    explains the purpose of the function only and does not describe how to
    perform motor testing, as that belongs to safety procedures.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن Motor Test وظيفة داخل الـ Firmware.
  - إدراك الغرض من وجود Motor Test.
  - التمييز بين مفهوم Motor Test وبين تنفيذ اختبار المحركات.

keyFacts:
  - Motor Test وظيفة Firmware.
  - ترتبط بمنظومة Flight Controller وESC والمحركات.
  - تتيح فهم استجابة المحركات لأوامر متحكم الطيران.
  - لا تشرح خطوات تشغيل المحركات.
  - لا تغني عن إجراءات السلامة.
  - تنفيذ Motor Test يختلف عن مفهومه.
  - إجراءات الاختبار العملي تنتمي إلى مفاهيم السلامة.

safety:
  level: high
  reviewed: false
  notes: >
    يشرح هذا المفهوم وظيفة Motor Test من الناحية المفاهيمية فقط.
    ولا يتضمن أي خطوات تشغيل أو اختبار عملي أو تعليمات تتعلق بالمراوح
    أو التسليح أو تشغيل المحركات. جميع الإجراءات العملية تنتمي إلى
    مفاهيم السلامة.
  blocksExternalProviders: false

misconceptions:
  - belief: Motor Test هو نفسه تشغيل المحركات للطيران.
    correction: >
      Motor Test هو وظيفة Firmware لفهم استجابة المحركات، وليس وضعاً
      مخصصاً للطيران أو بديلاً عن التشغيل الطبيعي.
    conceptLinked: firmware.flight_modes

  - belief: يمكن تنفيذ Motor Test دون أي اعتبارات سلامة.
    correction: >
      يشرح هذا المفهوم وظيفة Motor Test فقط، أما تنفيذ الاختبار عملياً
      فينتمي إلى مفاهيم وإجراءات السلامة.
    conceptLinked: firmware.failsafe

  - belief: Motor Test يختبر المحركات فقط.
    correction: >
      ترتبط وظيفة Motor Test بمنظومة الدفع كاملة، بما في ذلك متحكم
      الطيران وESC والمحركات.
    conceptLinked: selection.esc

expectedQuestions:
  - ما هو Motor Test؟
