architecturalNotes: |
  This concept explains Motor Test as a firmware function.
  It intentionally excludes motor-testing procedures, propeller removal,
  arming procedures, ESC calibration, troubleshooting, software UI
  walkthroughs, and product-specific implementations.
  Motor Test is not a Flight Mode.
  Practical motor testing belongs in the safety namespace.
  Flight Modes belong in firmware.flight_modes.
