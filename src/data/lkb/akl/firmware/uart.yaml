definition:
  text: >
    UART هو واجهة اتصال تسلسلية يوفرها متحكم الطيران ويستخدمها الـ Firmware
    للتواصل مع الوظائف والأجهزة التي تعتمد الاتصال التسلسلي، مثل المستقبل،
    ونظام الفيديو، ووحدات GPS وغيرها.
  textEn: >
    A UART is a serial communication interface provided by the Flight
    Controller and used by the firmware to communicate with serial-based
    functions and external devices such as receivers, video systems,
    GPS modules, and other peripherals.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يحتوي متحكم الطيران عادةً على عدة واجهات UART مستقلة. تمثل كل واجهة
    قناة اتصال يمكن أن يخصصها الـ Firmware لوظيفة معينة، مما يسمح
    بالتواصل مع عدة أجهزة أو خدمات بشكل منظم دون تداخل بين وظائفها.
  textEn: >
    A Flight Controller usually provides multiple independent UART
    interfaces. Each interface represents a communication channel that
    the firmware can assign to a specific function, allowing multiple
    devices or services to operate without conflicting with one another.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن UART يمثل واجهة اتصال يوفرها Flight Controller ويستخدمها الـ Firmware.
  - إدراك سبب وجود عدة واجهات UART داخل متحكم الطيران.
  - التمييز بين مفهوم UART وبين إعداده أو تخصيصه أو توصيله عملياً.

keyFacts:
  - UART يمثل واجهة اتصال تسلسلية داخل متحكم الطيران.
  - يوفر Flight Controller عادةً عدة واجهات UART مستقلة.
  - يمكن للـ Firmware إسناد كل UART إلى وظيفة مناسبة.
  - يساعد عدد واجهات UART المتاحة على تحديد إمكانيات الاتصال في البناء.
  - UART مفهوم أساسي لفهم إعدادات Firmware.
  - تخصيص وظائف UART ينتمي إلى مفهوم مستقل.
  - توصيل أسلاك TX وRX لا يندرج ضمن هذا المفهوم.

safety:
  level: low
  reviewed: false
  notes: >
    يشرح هذا المفهوم UART من الناحية المفاهيمية فقط، ولا يتضمن أي توصيل
    عملي أو إعداد داخل Betaflight أو تشغيل للمكونات.
  blocksExternalProviders: false

misconceptions:
  - belief: UART هو نفسه نقاط التوصيل الفيزيائية على متحكم الطيران.
    correction: >
      UART يمثل واجهة اتصال يستخدمها الـ Firmware، أما نقاط التوصيل الفيزيائية
      فتُشرح ضمن مفاهيم العتاد.
    conceptLinked: hardware.flight_controller

  - belief: يمكن استخدام واجهة UART نفسها لعدة وظائف مستقلة في الوقت نفسه.
    correction: >
      يجب تخصيص كل UART لوظيفة Firmware مناسبة بما يمنع تعارض الوظائف.
    conceptLinked: firmware.uart_configuration

  - belief: أي مشكلة في الريسيفر تعني أن الريسيفر نفسه معطّل.
    correction: >
      قد يكون سبب المشكلة مرتبطًا بتخصيص UART أو إعداد Firmware وليس بالريسيفر نفسه.
    conceptLinked: firmware.receiver_configuration

expectedQuestions:
  - ما هو UART؟
  - لماذا يوجد UART1 وUART2؟
  - ماذا يعني UART في Betaflight؟
  - هل UART هو نفسه TX وRX؟
  - لماذا يحتاج الريسيفر إلى UART؟
  - ما علاقة UART بـ GPS؟
  - هل يمكن استخدام UART نفسه لأكثر من وظيفة؟
  - ما الفرق بين UART وتخصيص UART؟

