definition:
  text: >
    إعداد الريسيفر هو ضبط الـ Firmware بحيث يتعرف متحكم الطيران على الريسيفر
    كمصدر لأوامر التحكم، ويفسر هذه الإشارات كمدخلات تحكم صحيحة داخل منظومة
    الطيران.
  textEn: >
    Receiver configuration is configuring the firmware so the Flight Controller
    recognizes the receiver as the source of control commands and interprets
    those signals as valid control inputs within the flight system.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    بعد اختيار الريسيفر كجزء من منظومة التحكم، يحتاج الـ Firmware إلى معرفة
    أن هذا الريسيفر هو مصدر أوامر التحكم. لا يكفي وجود الريسيفر ضمن البناء؛
    يجب أن يكون معروفاً داخل إعدادات الـ Firmware حتى تظهر القنوات وتعمل
    أوامر التحكم كما هو متوقع.
  textEn: >
    After the receiver is selected as part of the control system, the firmware
    must know that this receiver is the source of control commands. Having a
    receiver in the build is not enough; it must be recognized in the firmware
    so channels and control inputs behave as expected.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن إعداد الريسيفر يربط الريسيفر بمنطق التحكم داخل الـ Firmware.
  - إدراك أن اختيار الريسيفر لا يكفي دون تعريفه داخل الـ Firmware.
  - التمييز بين إعداد الريسيفر وبين التوصيل أو الـ Binding أو ضبط Failsafe.

keyFacts:
  - إعداد الريسيفر يجعل الـ Firmware يتعامل مع الريسيفر كمصدر أوامر التحكم.
  - يعتمد إعداد الريسيفر على بروتوكول الريسيفر وطريقة الاتصال المدعومة.
  - تخصيص UART الصحيح يسبق إعداد الريسيفر في كثير من الأنظمة التسلسلية.
  - Serial RX مثال شائع لوظيفة مرتبطة بإعداد الريسيفر.
  - ظهور القنوات في الـ Firmware يعتمد على صحة إعداد الريسيفر والمنظومة المرتبطة به.
  - Binding الريسيفر ليس هو نفسه إعداد الريسيفر داخل الـ Firmware.
  - Failsafe وإجراءات السلامة تنتمي إلى مفاهيم مستقلة.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح إعداد الريسيفر كمفهوم Firmware فقط. لا يتضمن توصيل
    الريسيفر أو Binding أو اختبار الطيران أو ضبط Failsafe أو أي إجراء تشغيل
    عملي. لأن إعداد الريسيفر يؤثر على أوامر التحكم، فهو قريب من السلامة لكنه
    ليس إجراء سلامة بحد ذاته.
  blocksExternalProviders: false

misconceptions:
  - belief: توصيل الريسيفر يعني أن الـ Firmware سيتعرف عليه تلقائياً.
    correction: >
      وجود الريسيفر في البناء لا يكفي؛ يجب أن يكون معروفاً داخل الـ Firmware
      حتى تُفسَّر أوامر التحكم بصورة صحيحة.
    conceptLinked: selection.receiver

  - belief: Binding الريسيفر هو نفسه إعداد الريسيفر.
    correction: >
      Binding ينشئ الاتصال بين جهاز الإرسال والريسيفر، أما إعداد الريسيفر
      فيجعل الـ Firmware يتعامل مع الريسيفر كمصدر لأوامر التحكم.
    conceptLinked: selection.receiver_protocol

  - belief: أي مشكلة في القنوات تعني أن الريسيفر تالف.
    correction: >
      قد يكون سبب المشكلة مرتبطاً بإعدادات الـ Firmware أو تخصيص UART،
      وليس بالريسيفر نفسه.
    conceptLinked: firmware.uart_configuration

expectedQuestions:
  - ما معنى إعداد الريسيفر؟
  - لماذا لا يعمل الريسيفر بعد تركيبه؟
  - ما الفرق بين Binding وإعداد الريسيفر؟
  - ما علاقة إعداد الريسيفر بـ UART؟
  - ما علاقة إعداد الريسيفر بـ Serial RX؟
  - لماذا لا تظهر القنوات داخل Firmware؟
  - هل يحتاج كل بروتوكول إلى إعداد؟
  - هل إعداد الريسيفر هو نفسه Failsafe؟

