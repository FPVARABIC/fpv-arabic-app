architecturalNotes: |
  This concept explains receiver configuration as a firmware concept.
  It intentionally excludes receiver wiring, binding procedures,
  Betaflight UI walkthroughs, stick calibration, endpoint tuning,
  failsafe setup, troubleshooting, and product-specific instructions.
  UART assignment belongs in firmware.uart_configuration.
  Receiver selection belongs in selection.receiver.
  Receiver protocol selection belongs in selection.receiver_protocol.
  Flight modes and failsafe are covered by separate firmware concepts.
