definition:
  text: >
    تخصيص وظائف UART هو إسناد وظيفة Firmware معينة إلى إحدى واجهات UART
    المتاحة داخل متحكم الطيران بحيث تمتلك كل وظيفة قناة الاتصال المناسبة
    لها دون تعارض مع وظائف أخرى.
  textEn: >
    UART function assignment is the allocation of a firmware function to
    one of the available UART interfaces so that each function uses an
    appropriate communication channel without conflicting with others.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يوفر متحكم الطيران عدة واجهات UART، لكن فائدتها لا تتحقق إلا عندما
    تُسند كل وظيفة إلى الواجهة المناسبة. بعض الوظائف تحتاج قناة اتصال
    خاصة بها، لذلك يساعد تخصيص وظائف UART على تنظيم الاتصال بين
    الـ Firmware والأجهزة المختلفة بطريقة واضحة ومنظمة.
  textEn: >
    A Flight Controller provides multiple UART interfaces, but they only
    become useful when firmware functions are assigned appropriately.
    Some functions require their own communication channel, making UART
    function assignment essential for organized communication between the
    firmware and connected devices.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن تخصيص UART يعني إسناد وظيفة Firmware إلى واجهة اتصال مناسبة.
  - إدراك أن لكل وظيفة قناة اتصال مخصصة داخل متحكم الطيران.
  - التمييز بين مفهوم تخصيص UART وبين خطوات الإعداد داخل البرامج.

keyFacts:
  - يعتمد تخصيص UART على عدد واجهات UART المتاحة.
  - يمنح كل وظيفة قناة اتصال مناسبة.
  - يساعد على منع تعارض وظائف Firmware.
  - يعتمد العديد من الأجهزة على تخصيص UART الصحيح.
  - فهم UART يسبق فهم تخصيصه.
  - هذا المفهوم لا يشرح خطوات Betaflight.
  - التنفيذ العملي ينتمي إلى مفاهيم Firmware مستقلة.

safety:
  level: low
  reviewed: false
  notes: >
    يشرح هذا المفهوم مبدأ تخصيص وظائف UART فقط، ولا يتضمن أي خطوات
    عملية أو إعداد داخل برامج Firmware.
  blocksExternalProviders: false

misconceptions:
  - belief: تخصيص UART يعني اختيار منفذ مادي فقط.
    correction: >
      تخصيص UART هو إسناد وظيفة Firmware إلى واجهة UART مناسبة، وليس مجرد
      اختيار نقطة توصيل أو منفذ مادي.
    conceptLinked: firmware.uart

  - belief: يمكن إسناد عدة وظائف مستقلة إلى UART واحد دون تأثير.
    correction: >
      يهدف تخصيص UART إلى تنظيم وظائف Firmware بحيث تستخدم كل وظيفة
      واجهة الاتصال المناسبة وتجنب التعارض.
    conceptLinked: firmware.uart

  - belief: أي مشكلة في الاتصال تعني أن الجهاز نفسه معطّل.
    correction: >
      قد يكون سبب المشكلة مرتبطًا بتخصيص وظيفة UART أو بإعدادات Firmware،
      وليس بالجهاز نفسه.
    conceptLinked: firmware.receiver_configuration

expectedQuestions:
  - ما معنى تخصيص UART؟
  - لماذا يحتاج كل جهاز إلى UART؟
  - هل يمكن استخدام UART نفسه لأكثر من وظيفة؟
  - ما علاقة UART بالريسيفر؟
  - ما علاقة UART بـ GPS؟
  - ما علاقة UART بنظام الفيديو؟
  - هل تخصيص UART هو نفسه إعداد Betaflight؟
  - لماذا يجب فهم UART قبل تخصيصه؟

