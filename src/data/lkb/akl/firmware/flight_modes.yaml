definition:
  text: >
    أوضاع الطيران هي حالات تشغيل داخل الـ Firmware تحدد السلوك الذي يطبقه
    متحكم الطيران عند تفسير أوامر التحكم والاستجابة لها أثناء تشغيل الدرون.
  textEn: >
    Flight Modes are operating states within the firmware that define how
    the Flight Controller interprets and responds to control inputs during
    drone operation.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يوفر الـ Firmware عدة أوضاع طيران، ويحدد كل وضع طريقة مختلفة لمعالجة
    أوامر التحكم أو مستوى المساعدة الذي يقدمه متحكم الطيران. فهم أوضاع
    الطيران يساعد على إدراك سبب اختلاف سلوك الدرون بين وضع وآخر دون
    الحاجة إلى تغيير مكونات البناء.
  textEn: >
    Firmware provides multiple Flight Modes, each defining a different way
    of processing control inputs or providing flight assistance. Understanding
    Flight Modes explains why the drone behaves differently between modes
    without changing any hardware components.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن Flight Modes تمثل حالات تشغيل داخل الـ Firmware.
  - إدراك أن كل وضع يغيّر منطق استجابة متحكم الطيران.
  - التمييز بين مفهوم Flight Modes وبين طريقة تفعيلها داخل البرامج.

keyFacts:
  - Flight Modes جزء من منطق الـ Firmware.
  - يحدد كل وضع سلوكاً مختلفاً لمتحكم الطيران.
  - قد توفر بعض الأوضاع مستوى مختلفاً من المساعدة أثناء الطيران.
  - يختلف استخدام أوضاع الطيران باختلاف هدف التشغيل.
  - قد تتضمن منظومة Flight Modes أوضاع تشغيل ووظائف خاصة بحسب نظام الـ Firmware.
  - إعداد Flight Modes ينتمي إلى مفاهيم Firmware مستقلة.
  - هذا المفهوم لا يشرح خطوات تفعيل أوضاع الطيران.

safety:
  level: medium
  reviewed: false
  notes: >
    يشرح هذا المفهوم أوضاع الطيران كمفهوم Firmware فقط، ولا يتضمن
    خطوات التفعيل أو الاختبار أو تشغيل المحركات أو أي إجراءات عملية.
  blocksExternalProviders: false

misconceptions:
  - belief: جميع أوضاع الطيران تجعل الدرون يتصرف بالطريقة نفسها.
    correction: >
      يحدد كل Flight Mode منطقاً مختلفاً لمعالجة أوامر التحكم أو مستوى
      المساعدة الذي يقدمه متحكم الطيران.
    conceptLinked: firmware.receiver_configuration

  - belief: تغيير Flight Mode يعني تغيير مكونات الدرون.
    correction: >
      Flight Modes تغير سلوك الـ Firmware فقط، ولا تتطلب أي تغيير في
      المكونات المادية.
    conceptLinked: selection.flight_controller

  - belief: Flight Modes هي نفسها Failsafe.
    correction: >
      Flight Modes تحدد سلوك التشغيل الطبيعي، بينما Failsafe مفهوم مستقل
      يعالج فقدان إشارة التحكم.
    conceptLinked: firmware.failsafe

expectedQuestions:
  - ما هي أوضاع الطيران؟
  - لماذا يختلف سلوك الدرون بين الأوضاع؟
  - ما الفرق بين Angle وAcro وHorizon؟
  - هل كل Firmware يحتوي على أوضاع الطيران نفسها؟
  - لماذا توجد عدة Flight Modes؟
  - هل Flight Modes هي نفسها Failsafe؟
  - هل إعداد Flight Modes هو نفسه تفعيلها؟
  - متى أحتاج إلى فهم Flight Modes؟

