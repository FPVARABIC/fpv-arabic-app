architecturalNotes: |
  This concept explains Flight Modes as firmware operating states.
  It intentionally excludes AUX channel assignment, switch mapping,
  software UI walkthroughs, arming procedures, motor testing,
  failsafe configuration, troubleshooting, and product-specific
  implementations.
  Definitions of individual modes (such as Angle, Horizon, or Acro)
  are outside the scope of this concept.
  Receiver configuration belongs in firmware.receiver_configuration.
  Failsafe belongs in firmware.failsafe.
