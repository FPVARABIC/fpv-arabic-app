architecturalNotes: |
  This concept explains Failsafe as a firmware safety behavior.
  It intentionally excludes configuration procedures, timeout values,
  stage definitions, receiver binding, flight testing, troubleshooting,
  and product-specific implementations.
  It does not define which Failsafe action is selected; that belongs to
  configuration or procedure concepts.
  Receiver configuration belongs in firmware.receiver_configuration.
  Flight Modes belong in firmware.flight_modes.
  Practical Failsafe testing belongs in the safety namespace.
