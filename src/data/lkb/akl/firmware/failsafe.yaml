definition:
  text: >
    Failsafe هو سلوك أمان داخل الـ Firmware يُفعَّل عندما يتوقف متحكم
    الطيران عن استقبال أوامر تحكم صحيحة، لينتقل إلى سلوك أمان محدد وفق
    منطق الـ Firmware.
  textEn: >
    Failsafe is a firmware safety behavior that activates when the Flight
    Controller no longer receives valid control input, transitioning to a
    predefined safety behavior according to firmware logic.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يعتمد متحكم الطيران على أوامر التحكم القادمة من الريسيفر أثناء التشغيل.
    عند فقدان هذه الأوامر أو عدم صلاحيتها، يطبق الـ Firmware سلوك Failsafe
    المحدد مسبقاً للتعامل مع حالة فقدان التحكم بطريقة منظمة وآمنة.
  textEn: >
    During operation, the Flight Controller relies on control input from
    the receiver. When that input is lost or becomes invalid, the firmware
    applies its predefined Failsafe behavior to handle the loss of control
    in a controlled and safe manner.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن Failsafe يمثل سلوك أمان داخل الـ Firmware.
  - إدراك أن Failsafe يعمل عند فقدان أوامر التحكم الصحيحة.
  - التمييز بين مفهوم Failsafe وبين طريقة إعداده أو اختباره.

keyFacts:
  - Failsafe جزء من منطق السلامة داخل الـ Firmware.
  - يُفعَّل عند فقدان أوامر التحكم الصحيحة.
  - يهدف إلى تقليل المخاطر عند فقدان التحكم.
  - يعتمد على منطق الـ Firmware وليس على نوع بروتوكول محدد.
  - إعداد Failsafe يختلف عن مفهومه.
  - اختبار Failsafe مفهوم مستقل.
  - هذا المفهوم لا يشرح خطوات إعداد Failsafe.

safety:
  level: high
  reviewed: false
  notes: >
    يشرح هذا المفهوم مبدأ Failsafe فقط. لا يتضمن أي خطوات إعداد أو اختبار
    أو تشغيل للمحركات أو تجارب طيران. ونظراً لارتباطه المباشر بسلامة
    الطائرة عند فقدان التحكم، فقد صُنّف بمستوى سلامة مرتفع.
  blocksExternalProviders: false

misconceptions:
  - belief: Failsafe يعني إيقاف الدرون فوراً في جميع الحالات.
    correction: >
      Failsafe لا يصف إجراءً واحداً ثابتاً، بل يمثل سلوك أمان يحدده
      الـ Firmware للتعامل مع فقدان أوامر التحكم.
    conceptLinked: firmware.flight_modes

  - belief: Failsafe يعمل فقط عند انقطاع الريسيفر.
    correction: >
      يعمل Failsafe عندما لا يستقبل متحكم الطيران أوامر تحكم صحيحة،
      بغض النظر عن السبب الذي أدى إلى ذلك.
    conceptLinked: firmware.receiver_configuration

  - belief: إعداد Failsafe هو نفسه مفهوم Failsafe.
    correction: >
      مفهوم Failsafe يشرح الغاية من وجود هذا السلوك، أما طريقة تطبيقه
      وإعداده فتندرج ضمن مفاهيم أو إجراءات مستقلة.
    conceptLinked: firmware.uart_configuration

expectedQuestions:
  - ما هو Failsafe؟
  - متى يعمل Failsafe؟
  - لماذا يحتاج الدرون إلى Failsafe؟
  - هل يعمل Failsafe مع جميع أنواع الريسيفرات؟
  - هل Failsafe هو نفسه فقدان الإشارة؟
  - ما الفرق بين Failsafe وإعداد Failsafe؟
  - ما الهدف من وجود Failsafe؟
  - ما علاقة Failsafe بأوضاع الطيران؟

