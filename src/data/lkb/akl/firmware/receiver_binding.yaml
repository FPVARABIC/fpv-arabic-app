definition:
  text: >
    Receiver Binding هو الارتباط المنطقي بين جهاز الإرسال والريسيفر
    الذي يسمح لهما بالتعرف على بعضهما وتبادل بيانات التحكم باستخدام
    بروتوكول اتصال متوافق.
  textEn: >
    Receiver Binding is the logical association between a transmitter
    and a receiver that allows them to recognize each other and exchange
    control data using a compatible communication protocol.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    استخدام البروتوكول نفسه لا يكفي لكي يتواصل جهاز الإرسال والريسيفر.
    يجب أن توجد بينهما علاقة ارتباط تسمح لكل منهما بالتعرف على الآخر
    قبل تبادل بيانات التحكم. تسمى هذه العلاقة Receiver Binding.
  textEn: >
    Sharing the same communication protocol is not enough for a
    transmitter and receiver to communicate. They must first establish
    an association that allows each device to recognize the other before
    exchanging control data. This association is called Receiver Binding.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن Receiver Binding علاقة ارتباط منطقية بين جهاز الإرسال والريسيفر.
  - إدراك أن Binding يختلف عن بروتوكول الاتصال.
  - التمييز بين Binding وبين إعدادات الـ Firmware.

keyFacts:
  - Receiver Binding ينشئ علاقة ارتباط بين جهاز الإرسال والريسيفر.
  - يعتمد على وجود بروتوكول اتصال متوافق.
  - لا يمثل بروتوكول اتصال بحد ذاته.
  - يختلف عن إعدادات الـ Firmware.
  - يختلف عن توصيل الأسلاك.
  - قد يحتاج إلى إعادة التنفيذ عند تغيير الأجهزة.
  - هذا المفهوم لا يشرح خطوات تنفيذ Binding.

safety:
  level: low
  reviewed: false
  notes: >
    يشرح هذا المفهوم Receiver Binding كمفهوم نظري فقط، ولا يتضمن أي
    خطوات عملية أو تعليمات تنفيذ.
  blocksExternalProviders: false

misconceptions:
  - belief: Receiver Binding هو نفسه بروتوكول الاتصال.
    correction: >
      بروتوكول الاتصال يحدد كيفية تبادل البيانات، أما Receiver Binding
      فهو علاقة ارتباط بين جهاز الإرسال والريسيفر تسمح باستخدام ذلك
      البروتوكول بينهما.
    conceptLinked: selection.receiver_protocol

  - belief: Receiver Binding هو نفسه إعداد الريسيفر.
    correction: >
      Receiver Binding يختلف عن إعدادات الريسيفر داخل الـ Firmware،
      فكل منهما يمثل مفهوماً مستقلاً.
    conceptLinked: firmware.receiver_configuration

  - belief: Receiver Binding هو توصيل الريسيفر بمتحكم الطيران.
    correction: >
      توصيل الريسيفر اتصال مادي بين المكونات، أما Receiver Binding
      فهو علاقة ارتباط منطقية بين جهاز الإرسال والريسيفر.
    conceptLinked: selection.receiver

expectedQuestions:
  - ما هو Receiver Binding؟
  - لماذا يحتاج جهاز الإرسال والريسيفر إلى Binding؟
  - هل Binding هو نفسه بروتوكول الاتصال؟
  - ما الفرق بين Binding وإعداد الريسيفر؟
  - هل يحتاج كل ريسيفر إلى Binding؟
  - هل يمكن استخدام جهاز إرسال آخر بعد تنفيذ Binding؟
  - هل يؤثر Binding على متحكم الطيران؟
  - متى قد يحتاج Receiver Binding إلى إعادة التنفيذ؟

