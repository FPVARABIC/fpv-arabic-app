architecturalNotes: |
  This concept explains GPS configuration as a firmware concept.
  It intentionally excludes GPS wiring, UART procedures, baud-rate
  selection, satellite acquisition, software UI walkthroughs,
  troubleshooting, and product-specific implementations.
  This concept explains how firmware recognizes GPS data, not how
  navigation features use that data.
  GPS selection belongs in selection.gps.
  UART assignment belongs in firmware.uart_configuration.
  Navigation configuration belongs in firmware.navigation_configuration.
