    Canonical firmware concept authored from Flight Controller firmware
    GPS-configuration fundamentals and organized for AKL.
  extractionNotes: >
    This concept explains GPS configuration as a firmware concept that
    enables the Flight Controller to recognize and interpret positioning
    data from a GPS module. It intentionally excludes GPS wiring, UART
