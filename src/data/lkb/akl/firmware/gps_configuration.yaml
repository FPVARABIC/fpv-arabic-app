definition:
  text: >
    إعداد GPS هو ضبط الـ Firmware بحيث يتعرف متحكم الطيران على بيانات
    تحديد الموقع القادمة من وحدة GPS ويفسرها لاستخدامها ضمن وظائف
    الـ Firmware التي تعتمد على بيانات الموقع.
  textEn: >
    GPS configuration is configuring the firmware so the Flight Controller
    recognizes and interprets positioning data received from a GPS module
    for firmware functions that rely on location information.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يكفي تركيب وحدة GPS داخل الدرون حتى تصبح بيانات الموقع متاحة
    لمتحكم الطيران. يحتاج الـ Firmware إلى التعرف على بيانات GPS
    والتعامل معها بصورة صحيحة حتى تتمكن وظائف الـ Firmware المعتمدة
    على بيانات الموقع من استخدامها.
  textEn: >
    Installing a GPS module alone does not make positioning data available
    to the Flight Controller. The firmware must recognize and process GPS
    information correctly before firmware functions that rely on location
    data can use it.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن إعداد GPS يعرّف الـ Firmware ببيانات تحديد الموقع.
  - إدراك أن تركيب GPS لا يكفي دون إعداد Firmware المناسب.
  - التمييز بين مفهوم إعداد GPS وبين توصيله أو ضبطه عملياً.

keyFacts:
  - إعداد GPS جزء من إعدادات الـ Firmware.
  - يعتمد على وصول بيانات GPS إلى الـ Firmware.
  - يعتمد على إعداد UART المناسب.
  - يتيح لمتحكم الطيران تفسير بيانات الموقع.
  - إعداد GPS يختلف عن اختيار وحدة GPS.
  - إعداد GPS يختلف عن توصيل GPS.
  - هذا المفهوم لا يشرح خطوات إعداد GPS عملياً.

safety:
  level: medium
  reviewed: false
  notes: >
    يشرح هذا المفهوم إعداد GPS كمفهوم Firmware فقط، ولا يتضمن خطوات
    إعداد أو اختبار أو توصيل أو إجراءات طيران عملية.
  blocksExternalProviders: false

misconceptions:
  - belief: تركيب وحدة GPS يعني أن متحكم الطيران سيستخدم بيانات الموقع تلقائياً.
    correction: >
      وجود وحدة GPS وحده لا يكفي؛ يجب أن يكون الـ Firmware مهيأً
      لاستقبال بيانات الموقع وتفسيرها.
    conceptLinked: firmware.uart_configuration

  - belief: إعداد GPS هو نفسه توصيل GPS.
    correction: >
      توصيل وحدة GPS يختلف عن إعداد الـ Firmware للتعامل مع بياناتها.
    conceptLinked: selection.gps

  - belief: إعداد GPS يعني إعداد جميع وظائف الملاحة.
    correction: >
      إعداد GPS يقتصر على تعريف الـ Firmware ببيانات الموقع، أما
      استخدام هذه البيانات داخل الوظائف المختلفة فينتمي إلى مفاهيم
      Firmware مستقلة.
    conceptLinked: firmware.uart_configuration

expectedQuestions:
  - ما هو إعداد GPS؟
  - لماذا لا يعمل GPS بعد تركيبه؟
  - ما الفرق بين تركيب GPS وإعداده؟
  - ما علاقة GPS بـ UART؟
  - لماذا يحتاج الـ Firmware إلى إعداد GPS؟
  - هل كل وحدات GPS تحتاج إلى إعداد؟
  - هل إعداد GPS هو نفسه إعداد الملاحة؟
  - ما الذي يستخدم بيانات GPS داخل الـ Firmware؟

