  This concept explains the rotational axes only.
  It intentionally excludes radio setup, stick mode configuration, Betaflight
  channel mapping, rates, expo, and practical flight drills.
  Relations to control.stick_inputs and flight.stability are intentionally
  omitted here and should be authored from those future concepts if needed.
