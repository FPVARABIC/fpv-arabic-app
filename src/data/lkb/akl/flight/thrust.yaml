architecturalNotes: |
  This concept explains only the physical principle of thrust.
  It intentionally excludes motor testing procedures, Betaflight setup,
  propeller installation, and practical safety workflows.
  The safety level is high because applying thrust knowledge can lead learners
  toward motor and propeller testing, while the actual protocol belongs in
  dedicated safety/procedure nodes.
