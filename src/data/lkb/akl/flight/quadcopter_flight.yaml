definition:
  text: >
    يطير الكوادكابتر عندما يعمل نظام الدفع على توليد قوة كافية لموازنة الوزن
    أو تجاوزه، بينما تنسق وحدة التحكم بالطيران سرعة المحركات للحفاظ على
    الاستقرار وتنفيذ أوامر الطيار.
  textEn: >
    A quadcopter flies when its propulsion system generates enough thrust to
    balance or exceed its weight, while the flight controller coordinates motor
    speeds to maintain stability and execute pilot commands.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يعتمد طيران الكوادكابتر على جزء واحد فقط، بل على عمل عدة أنظمة معًا.
    تولد المراوح قوة الدفع، ويؤثر الوزن باستمرار نحو الأسفل، بينما تضبط وحدة
    التحكم سرعة المحركات للحفاظ على توازن الدرون والاستجابة لحركة عصي جهاز
    التحكم. يساعد فهم هذه المبادئ الأساسية على استيعاب بقية مفاهيم الطيران
    والبناء.
  textEn: >
    A quadcopter does not fly because of a single component.
    The propellers generate thrust, weight constantly acts downward, and the
    flight controller adjusts motor speeds to keep the aircraft stable and
    responsive to pilot inputs.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - تكوين تصور عام عن كيفية طيران الكوادكابتر.
  - التعرف على الأنظمة الرئيسية المشاركة في عملية الطيران.
  - الاستعداد لدراسة مفاهيم الطيران الأساسية بالتفصيل.

keyFacts:
  - الطيران ينتج عن تفاعل عدة أنظمة تعمل معًا.
  - الدفع والوزن من أهم القوى المؤثرة أثناء الطيران.
  - وحدة التحكم بالطيران تنسق عمل المحركات ولا تولد قوة الدفع بنفسها.
  - استقرار الدرون يعتمد على التحكم المستمر في سرعة المحركات.
  - هذا المفهوم يقدم نظرة عامة، بينما تشرح المفاهيم التالية كل عنصر بالتفصيل.

misconceptions:
  - belief: الكوادكابتر يطير لأن المحركات تدور فقط.
    correction: >
      دوران المحركات وحده لا يكفي، بل يجب أن تعمل جميع أنظمة الطيران معًا
      بطريقة صحيحة.
    conceptLinked: flight.thrust

  - belief: وحدة التحكم بالطيران هي التي ترفع الدرون.
    correction: >
      وحدة التحكم لا تولد الدفع، وإنما تنظم سرعة المحركات لتحقيق الطيران
      المستقر.
    conceptLinked: hardware.flight_controller

  - belief: فهم جزء واحد يكفي لفهم كيفية طيران الدرون.
    correction: >
      الطيران نتيجة تفاعل الدفع والوزن والاستقرار وأنظمة التحكم معًا.
    conceptLinked: flight.thrust

expectedQuestions:
  - كيف يطير الكوادكابتر؟
  - ما الذي يجعل الدرون يرتفع عن الأرض؟
  - ما دور وحدة التحكم بالطيران؟
  - هل المحركات وحدها تجعل الدرون يطير؟
  - لماذا يحتاج الدرون إلى أربع مراوح؟
  - ما أول المفاهيم التي يجب تعلمها لفهم الطيران؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: flight.quadcopter_flight
    status: draft
    question: >
      لماذا لا يمكن تفسير طيران الكوادكابتر بالاعتماد على المحركات وحدها؟
    explanation: >
      لأن الطيران يعتمد على تفاعل عدة أنظمة، مثل الدفع والوزن ووحدة التحكم
      بالطيران، وليس على دوران المحركات فقط.

  - type: analysis
    level: beginner
    linkedConceptId: flight.quadcopter_flight
    status: draft
    question: >
      ما الفائدة من دراسة هذا المفهوم قبل الانتقال إلى مفاهيم الطيران الأخرى؟
    explanation: >
      لأنه يقدم صورة عامة تساعد على فهم العلاقات بين المفاهيم التي ستدرس
      لاحقًا، مثل الدفع والوزن والتحويم والاستقرار.

