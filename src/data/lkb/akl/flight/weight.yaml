architecturalNotes: |
  This concept explains only the role of weight in quadcopter flight.
  It intentionally excludes thrust-to-weight calculations, battery selection,
  structural optimization, and practical build procedures.
  The symmetric balances relation with flight.thrust is authored only on
  flight.thrust to avoid duplicate reciprocal relations.
