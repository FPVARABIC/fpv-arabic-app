definition:
  text: >
    التحويم هو حالة طيران يبقى فيها الكوادكابتر على ارتفاع وموضع شبه ثابتين
    عندما يتوازن الدفع الكلي تقريبًا مع الوزن، وتستمر وحدة التحكم بالطيران
    في تصحيح الاتزان.
  textEn: >
    Hover is the flight state in which a quadcopter stays at an approximately
    constant altitude and position when total thrust is roughly balanced with
    weight and the flight controller continues correcting balance.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    أثناء التحويم لا يكون الدرون ثابتًا تمامًا مثل جسم معلّق في الهواء.
    بل يقوم Flight Controller بتعديلات صغيرة ومستمرة على سرعة المحركات للحفاظ
    على الارتفاع والاتزان. إذا قل الدفع عن الوزن يبدأ الدرون بالهبوط، وإذا زاد
    الدفع عن الوزن يبدأ بالصعود.
  textEn: >
    During hover, the drone is not perfectly motionless like a suspended object.
    The flight controller continuously makes small motor-speed corrections to
    maintain altitude and balance. If thrust drops below weight, the drone descends;
    if thrust exceeds weight, it climbs.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم معنى التحويم في الكوادكابتر.
  - ربط التحويم بتوازن الدفع والوزن.
  - إدراك أن التحويم يحتاج تصحيحات مستمرة وليس حالة سكون كاملة.

keyFacts:
  - التحويم يحدث عندما يكون الدفع الكلي قريبًا من وزن الدرون.
  - التحويم لا يعني أن الدرون ثابت تمامًا بلا تصحيح.
  - Flight Controller يساعد على الحفاظ على الاتزان أثناء التحويم.
  - وزن الدرون ونظام الدفع يؤثران مباشرة في جودة التحويم.
  - التحويم مفهوم أساسي لفهم الإقلاع والهبوط وأول طيران آمن.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح معنى التحويم فقط، ولا يعد دليلاً عمليًا لتجربة أول
    تحويم. يجب أن يتم أي تدريب عملي على التحويم ضمن مفاهيم وإجراءات السلامة
    المخصصة لأول طيران آمن.
  blocksExternalProviders: false

misconceptions:
  - belief: التحويم يعني أن الدرون لا يتحرك إطلاقًا.
    correction: >
      التحويم يعني بقاء الارتفاع والموضع شبه ثابتين، لكنه يتطلب تصحيحات
      مستمرة وقد تحدث حركات صغيرة بسبب الرياح أو التحكم أو عدم التوازن.
    conceptLinked: flight.stability

  - belief: التحويم يعتمد فقط على قوة المحركات.
    correction: >
      التحويم يعتمد على توازن الدفع مع الوزن، وعلى عمل Flight Controller
      وتوزيع الوزن واستجابة نظام الدفع.
    conceptLinked: flight.thrust

  - belief: إذا استطاع الدرون التحويم فهذا يعني أن كل الإعدادات مثالية.
    correction: >
      القدرة على التحويم لا تعني أن كل شيء مثالي؛ فقد تبقى مشاكل في التوازن
      أو الاهتزاز أو إعدادات التحكم.
    conceptLinked: flight.stability

expectedQuestions:
  - ما هو التحويم؟
  - كيف يبقى الدرون ثابتًا في الهواء؟
  - ما العلاقة بين التحويم والدفع؟
  - ما العلاقة بين التحويم والوزن؟
  - لماذا يهبط الدرون أثناء التحويم؟
  - لماذا يصعد الدرون أثناء التحويم؟
  - هل التحويم يعني أن الدرون ثابت تمامًا؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: flight.hover
    status: draft
    question: >
      لماذا يبدأ الدرون بالهبوط إذا أصبح الدفع الكلي أقل من الوزن أثناء التحويم؟
    explanation: >
      لأن القوة المؤثرة إلى الأسفل تصبح أكبر من القوة التي تدفع الدرون إلى الأعلى،
      فيفقد القدرة على الحفاظ على ارتفاعه.

  - type: analysis
    level: beginner
    linkedConceptId: flight.hover
    status: draft
    question: >
      لماذا لا نعتبر التحويم حالة سكون تام رغم أن الدرون يبقى تقريبًا في مكانه؟
    explanation: >
      لأن Flight Controller والطيار يقومان بتصحيحات مستمرة، وقد تؤثر عوامل مثل
      الرياح وتوزيع الوزن والاهتزازات في حركة الدرون الصغيرة.

