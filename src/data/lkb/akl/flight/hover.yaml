architecturalNotes: |
  This concept explains hover as a flight state, not as a first-flight procedure.
  It intentionally excludes arming, throttle practice, Betaflight setup,
  propeller safety, and outdoor first-flight steps.
  The included safety block defines the safe scope of this concept only.
  Practical hover training belongs in dedicated safety and procedure nodes.
