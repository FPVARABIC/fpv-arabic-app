definition:
  text: >
    الاستقرار هو قدرة الكوادكابتر على الحفاظ على سلوك طيران متوازن والاستجابة
    بصورة متوقعة للتغيرات وأوامر التحكم.
  textEn: >
    Flight stability is the ability of a quadcopter to maintain balanced flight
    behavior and respond predictably to changes and control inputs.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    الدرون المستقر لا يعني أنه لا يتحرك، بل يعني أنه يستجيب بطريقة متوقعة ولا
    يفقد اتزانه بسهولة. يعتمد الاستقرار على عدة عوامل تعمل معًا مثل توزيع الوزن،
    ونظام الدفع، ووحدة التحكم بالطيران.
  textEn: >
    A stable drone is not one that never moves, but one that responds
    predictably without easily losing balance. Stability depends on several
    factors working together, including weight distribution, propulsion, and
    the flight controller.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم معنى الاستقرار في الكوادكابتر.
  - إدراك أن الاستقرار ينتج عن عدة عوامل مجتمعة.
  - التمييز بين الاستقرار وبين السكون التام.

keyFacts:
  - الاستقرار لا يعني بقاء الدرون ثابتًا دون حركة.
  - توزيع الوزن يؤثر في الاستقرار.
  - نظام الدفع يؤثر في جودة الاستقرار.
  - Flight Controller يساعد على الحفاظ على الاتزان أثناء الطيران.
  - الاستقرار الجيد يجعل استجابة الدرون أكثر قابلية للتوقع.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح معنى الاستقرار فقط، ولا يتضمن ضبط إعدادات التحكم
    أو تعديل قيم PID أو تنفيذ اختبارات طيران عملية.
    أي تطبيق عملي يجب أن يتم ضمن مفاهيم وإجراءات السلامة المخصصة.
  blocksExternalProviders: false

misconceptions:
  - belief: الاستقرار يعني أن الدرون لا يتحرك إطلاقًا.
    correction: >
      الاستقرار يعني أن الدرون يحافظ على سلوك متوقع ومتزن، وليس أنه يبقى ساكنًا.
    conceptLinked: flight.hover

  - belief: تغيير إعداد واحد فقط يجعل الدرون مستقرًا دائمًا.
    correction: >
      الاستقرار ينتج عن عمل عدة عناصر معًا، وليس عن عامل واحد فقط.
    conceptLinked: flight.center_of_gravity

  - belief: إذا استطاع الدرون الإقلاع فهو مستقر بالضرورة.
    correction: >
      الإقلاع لا يعني أن الدرون مستقر؛ فقد تظهر مشاكل في الاتزان أو الاستجابة أثناء الطيران.
    conceptLinked: flight.hover

expectedQuestions:
  - ما معنى الاستقرار؟
  - لماذا يهتز بعض الدرونات؟
  - هل الاستقرار يعني عدم الحركة؟
  - ما علاقة مركز الثقل بالاستقرار؟
  - هل يؤثر نظام الدفع في الاستقرار؟
  - هل Flight Controller مسؤول عن الاستقرار؟
  - لماذا يبدو بعض الدرونات أسهل في التحكم من غيرها؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: flight.stability
    status: draft
    question: >
      لماذا لا يعني الإقلاع الناجح أن الدرون مستقر تمامًا؟
    explanation: >
      لأن الاستقرار يقاس بقدرة الدرون على الحفاظ على اتزانه والاستجابة
      المتوقعة أثناء الطيران، وليس بمجرد قدرته على الإقلاع.

  - type: analysis
    level: beginner
    linkedConceptId: flight.stability
    status: draft
    question: >
      لماذا يعتمد الاستقرار على أكثر من عامل واحد؟
    explanation: >
      لأن توزيع الوزن، ونظام الدفع، ووحدة التحكم بالطيران تعمل معًا
      لتحديد سلوك الدرون أثناء الطيران.

