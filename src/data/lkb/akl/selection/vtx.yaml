architecturalNotes: |
  This is a selection concept about choosing a VTX as part of an FPV video system.
  It intentionally excludes wiring, soldering, power-level setup, channels,
  frequencies, SmartAudio, Tramp, Betaflight configuration, antenna mounting,
  heat testing, product comparisons, and RF operation procedures.
  VTX hardware function belongs in hardware.vtx, configuration belongs in
  firmware.vtx_configuration, antenna selection belongs in selection.antenna,
  and safe practical operation belongs in safety.vtx_operation.
