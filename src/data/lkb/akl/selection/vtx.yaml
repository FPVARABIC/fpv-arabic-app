challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.vtx
    status: draft
    question: >
      لماذا لا يجب اختيار VTX بناءً على قدرة الإرسال فقط؟
    explanation: >
      لأن جودة الإشارة تعتمد أيضًا على التوافق مع نظام الفيديو، الهوائي، التبريد،
      البيئة، وجودة المنظومة كاملة، وليس على القدرة وحدها.

  - type: analysis
    level: beginner
    linkedConceptId: selection.vtx
    status: draft
    question: >
      لماذا يجب اختيار VTX بعد اختيار نظام الفيديو؟
    explanation: >
      لأن VTX يجب أن يعمل ضمن منظومة متوافقة مع الكاميرا والنظارة أو جهاز
      الاستقبال، ولا تعمل جميع أجهزة VTX مع جميع الأنظمة.

