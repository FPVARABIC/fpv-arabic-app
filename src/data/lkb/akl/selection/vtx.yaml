definition:
  text: >
    اختيار VTX هو اختيار جهاز إرسال فيديو متوافق مع نظام الفيديو والكاميرا
    والنظارة، ويناسب حجم الدرون وهدف البناء ومتطلبات المدى وجودة الإشارة.
  textEn: >
    VTX selection is choosing a video transmitter that is compatible with the
    video system, camera, and goggles, while fitting the drone size, build goal,
    range needs, and signal-quality requirements.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    الـ VTX هو الجزء الذي يرسل صورة الكاميرا من الدرون إلى النظارة أو الشاشة.
    لا يتم اختياره وحده؛ يجب أن يكون ضمن نظام فيديو متوافق مع الكاميرا والنظارة.
    في الأنظمة التناظرية والرقمية تختلف طريقة التوافق والحجم والوزن والطاقة،
    لذلك يجب اختيار VTX بناءً على المنظومة كاملة وليس على رقم القدرة أو السعر فقط.
  textEn: >
    The VTX is the part that sends the camera image from the drone to the goggles
    or display. It is not selected in isolation; it must belong to a video system
    compatible with the camera and goggles. Analog and digital systems differ in
    compatibility, size, weight, and power needs, so the VTX should be chosen
    based on the whole ecosystem rather than power rating or price alone.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن VTX جزء من منظومة فيديو متوافقة.
  - ربط اختيار VTX بالكاميرا والنظارة ونظام الفيديو.
  - إدراك أن القدرة أو السعر وحدهما لا يكفيان لاختيار VTX مناسب.

keyFacts:
  - VTX يجب أن يكون متوافقًا مع نظام الفيديو المختار.
  - VTX يجب أن يتوافق مع الكاميرا والنظارة أو جهاز الاستقبال المستخدم.
  - حجم ووزن VTX مهمان خصوصًا في الدرونات الصغيرة أو Cinewhoop.
  - بعض أنظمة الفيديو الرقمية تعتمد على وحدات مدمجة تجمع الكاميرا والإرسال ضمن منظومة محددة.
  - قدرة الإرسال ليست العامل الوحيد في الاختيار، ولا تعني وحدها جودة أفضل.
  - VTX يحتاج طاقة وتبريدًا مناسبين، لكن تفاصيل التوصيل والتشغيل تنتمي لمفاهيم أخرى.
  - اختيار VTX يجب أن يأتي بعد اختيار نظام الفيديو العام.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار VTX فقط، لكنه قريب من قرارات الطاقة والحرارة
    وإرسال الإشارة. لا يتضمن هذا المفهوم توصيل VTX أو تشغيله أو ضبط قدرة الإرسال
    أو اختيار القنوات أو تركيب الهوائيات. أي تطبيق عملي يجب أن يتم ضمن مفاهيم
    التثبيت والسلامة والإعداد المخصصة.
  blocksExternalProviders: false

misconceptions:
  - belief: أي VTX يعمل مع أي كاميرا وأي نظارة.
    correction: >
      يجب أن يكون VTX متوافقًا مع نظام الفيديو والكاميرا والنظارة أو جهاز
      الاستقبال المستخدم.
    conceptLinked: selection.video_system

  - belief: القدرة الأعلى في VTX تعني دائمًا صورة أفضل.
    correction: >
      قدرة الإرسال ليست العامل الوحيد؛ التوافق، الهوائي، البيئة، التبريد،
      والنظام المستخدم كلها تؤثر في جودة الإشارة.
    conceptLinked: selection.antenna

  - belief: اختيار VTX يمكن أن يتم قبل اختيار نظام الفيديو.
    correction: >
      اختيار VTX يجب أن يأتي بعد اختيار نظام الفيديو، لأن VTX جزء من منظومة
      متوافقة وليس قطعة مستقلة.
    conceptLinked: selection.video_system

