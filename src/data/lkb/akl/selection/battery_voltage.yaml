architecturalNotes: |
  This is a selection concept about choosing LiPo battery voltage/cell count.
  It intentionally excludes charging instructions, storage voltage procedures,
  wiring, soldering, connector replacement, motor testing, propeller installation,
  exact voltage tables, and product recommendations.
  Battery handling belongs in safety.lipo_handling, battery theory belongs in
  power.lipo_battery, and capacity/C-rating belong in dedicated selection concepts.
