definition:
  text: >
    اختيار جهد البطارية هو اختيار عدد خلايا LiPo مثل 3S أو 4S أو 6S بما يناسب
    المحركات، KV، الـ ESC، المراوح، وهدف البناء دون تجاوز حدود النظام.
  textEn: >
    Battery voltage selection is choosing the LiPo cell count, such as 3S, 4S,
    or 6S, to match the motors, KV, ESC, propellers, and build goal without
    exceeding the system limits.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    في بطاريات LiPo، الحرف S يعني عدد الخلايا المتصلة على التوالي، وكلما زاد
    عدد الخلايا زاد الجهد الكلي. الجهد الأعلى لا يعني أنه أفضل دائمًا؛ لأنه
    يرفع سرعة الدوران النظرية للمحرك مع نفس KV وقد يزيد التيار والحرارة والضغط
    على ESC والبطارية. لذلك يجب اختيار 3S أو 4S أو 6S كجزء من نظام متوافق كامل.
  textEn: >
    In LiPo batteries, S means the number of cells connected in series, and more
    cells means higher total voltage. Higher voltage is not always better because
    it increases the motor's theoretical RPM for the same KV and can increase
    current, heat, and stress on the ESC and battery. The choice between 3S, 4S,
    or 6S must be made as part of a compatible whole system.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم معنى 3S و4S و6S كعدد خلايا يؤثر في الجهد.
  - ربط جهد البطارية باختيار KV المحرك والـ ESC والمراوح.
  - إدراك أن الجهد الأعلى يحتاج توافقًا كاملًا وليس مجرد بطارية أقوى.

keyFacts:
  - S في بطاريات LiPo تعني عدد الخلايا المتصلة على التوالي.
  - زيادة عدد الخلايا ترفع الجهد الكلي للبطارية.
  - الجهد الأعلى مع نفس KV يرفع سرعة الدوران النظرية للمحرك.
  - ESC والمحركات وبقية الإلكترونيات يجب أن تدعم الجهد المختار.
  - 4S و6S قد يستخدمان في فئات مختلفة، لكن الاختيار يعتمد على النظام الكامل.
  - جهد غير مناسب قد يسبب حرارة، تلف مكونات، أو أداء غير متوازن.
  - اختيار الجهد يجب أن يسبق أو يرافق اختيار KV والـ ESC وبقية نظام الدفع.

safety:
  level: high
  reviewed: false
  notes: >
    هذا المفهوم مرتبط مباشرة بجهد بطاريات LiPo وتوافق المحركات والـ ESC، وقد
    يؤدي سوء الاختيار إلى تلف مكونات أو سخونة أو خطر كهربائي. لا يتضمن هذا
    المفهوم شحن البطاريات أو توصيلها أو اختبار المحركات أو تشغيل الدرون.
    أي تطبيق عملي يجب أن يتم ضمن مفاهيم السلامة والفحص الخاصة بالبطاريات والطاقة.
  blocksExternalProviders: false

misconceptions:
  - belief: 6S أفضل دائمًا من 4S لأنه جهد أعلى.
    correction: >
      6S قد يكون مناسبًا لبعض الأنظمة، لكنه ليس أفضل دائمًا. يجب أن يناسب KV
      المحرك، ESC، المروحة، الوزن، وهدف البناء.
    conceptLinked: selection.component_matching

  - belief: يمكن استخدام أي بطارية طالما أن الموصل يركب.
    correction: >
      توافق الموصل لا يعني توافق الجهد. يجب التأكد أن ESC والمحركات والإلكترونيات
      تدعم عدد الخلايا والجهد المختار.
    conceptLinked: selection.esc_current

  - belief: KV المحرك لا علاقة له بعدد خلايا البطارية.
    correction: >
      KV والجهد مرتبطان مباشرة؛ مع نفس KV، زيادة الجهد ترفع سرعة الدوران النظرية.
    conceptLinked: selection.motor_kv

expectedQuestions:
  - ما معنى 3S و4S و6S؟
  - هل 6S أفضل من 4S؟
  - كيف أختار جهد البطارية؟
  - ما علاقة جهد البطارية بـ KV؟
  - هل يمكن تركيب أي بطارية إذا كان الموصل مناسبًا؟
  - هل ESC يجب أن يدعم 6S؟
  - ماذا يحدث إذا كان الجهد غير مناسب؟
  - هل الجهد الأعلى يعطي أداء أفضل دائمًا؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.battery_voltage
    status: draft
    question: >
      لماذا لا يكفي أن يكون موصل البطارية مناسبًا حتى نقول إن البطارية صالحة للنظام؟
    explanation: >
      لأن الموصل لا يحدد توافق الجهد. يجب أن تدعم المحركات والـ ESC والإلكترونيات
      عدد الخلايا والجهد المختار حتى لا يحدث تلف أو أداء غير آمن.

  - type: analysis
    level: beginner
    linkedConceptId: selection.battery_voltage
    status: draft
    question: >
      لماذا قد يكون استخدام 6S مع KV غير مناسب مشكلة؟
    explanation: >
      لأن زيادة الجهد مع KV مرتفع قد ترفع سرعة الدوران النظرية والتيار والحرارة،
      مما يضغط على المحركات والـ ESC والبطارية.

