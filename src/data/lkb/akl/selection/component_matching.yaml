definition:
  text: >
    توافق القطع هو التأكد من أن الفريم، المراوح، المحركات، الـ ESC، البطارية،
    ووحدة التحكم وأنظمة الاتصال والفيديو تعمل معًا ضمن حدود مناسبة وآمنة.
  textEn: >
    Component matching is the process of making sure the frame, propellers, motors,
    ESC, battery, flight controller, control link, and video system work together
    within suitable and safe limits.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يكفي أن تكون كل قطعة جيدة وحدها؛ يجب أن تناسب القطع بعضها البعض.
    حجم الفريم يحدد حجم المراوح، والمراوح تؤثر في اختيار المحركات، والمحركات
    تحدد متطلبات الـ ESC والبطارية، بينما تحتاج الأنظمة الإلكترونية إلى جهد
    وتوصيلات مناسبة. عندما يكون التوافق ضعيفًا قد يصبح الدرون صعب التحكم أو
    غير فعال أو معرضًا لمشاكل كهربائية وميكانيكية.
  textEn: >
    It is not enough for each part to be good on its own; the parts must fit each
    other as a system. Frame size limits propeller size, propellers affect motor
    choice, motors define ESC and battery requirements, and electronic systems
    need suitable voltage and connections. Poor matching can make the drone hard
    to control, inefficient, or vulnerable to electrical and mechanical problems.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن اختيار القطع يجب أن يتم كنظام مترابط.
  - معرفة أهم أزواج التوافق بين الفريم، المراوح، المحركات، ESC، والبطارية.
  - إدراك أن عدم التوافق قد يسبب أداء ضعيفًا أو مشاكل سلامة.

keyFacts:
  - الفريم يحدد غالبًا حجم المراوح والمساحة المتاحة للتركيب.
  - المروحة يجب أن تناسب حجم الفريم وقدرة المحرك.
  - المحرك يجب أن يناسب حجم المروحة، جهد البطارية، وهدف البناء.
  - الـ ESC يجب أن يتحمل التيار المتوقع من المحركات والمراوح والبطارية.
  - البطارية يجب أن تناسب الجهد، التيار، الوزن، والمساحة المتاحة.
  - Flight Controller يجب أن يملك المنافذ والجهود المناسبة للريسيفر ونظام الفيديو والملحقات.
  - توافق القطع يقلل الشراء العشوائي ويجعل البناء أكثر أمانًا وقابلية للنجاح.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح توافق القطع على مستوى التخطيط فقط، لكنه مرتبط بقرارات قد
    تؤثر في السلامة مثل الجهد، التيار، المراوح، البطارية، والـ ESC. لا يتضمن
    هذا المفهوم توصيل أسلاك أو لحام أو اختبار محركات. أي تطبيق عملي يجب أن يتم
    ضمن مفاهيم التوافق التفصيلية وإجراءات السلامة والفحص المخصصة.
  blocksExternalProviders: false

misconceptions:
  - belief: إذا كانت كل قطعة ممتازة وحدها فسيكون الدرون ممتازًا.
    correction: >
      جودة القطعة وحدها لا تكفي. يجب أن تكون القطع متوافقة في الحجم، الجهد،
      التيار، التركيب، والوظيفة.
    conceptLinked: hardware.quadcopter_system

  - belief: يمكن تركيب أي مروحة على أي محرك إذا ركبت ميكانيكيًا.
    correction: >
      تركيب المروحة ميكانيكيًا لا يعني أنها مناسبة للمحرك أو الفريم أو البطارية.
      يجب أن تكون المروحة ضمن قدرة نظام الدفع.
    conceptLinked: selection.propeller_size

  - belief: اختيار بطارية أكبر دائمًا يحسن الأداء.
    correction: >
      البطارية الأكبر قد تزيد الوزن وتغير مركز الثقل وتتطلب توافقًا مع الجهد
      والتيار والمساحة المتاحة.
    conceptLinked: selection.battery_voltage

expectedQuestions:
  - ما معنى توافق القطع؟
  - كيف أعرف أن القطع تناسب بعضها؟
  - هل يمكن تركيب أي محرك مع أي مروحة؟
  - كيف أختار ESC مناسبًا للمحركات؟
  - هل البطارية الأكبر أفضل دائمًا؟
  - ما علاقة الفريم بحجم المراوح؟
  - ما علاقة حجم الدرون بتوافق القطع؟
  - ماذا يحدث إذا كانت القطع غير متوافقة؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.component_matching
    status: draft
    question: >
      لماذا لا يكفي أن تختار محركًا قويًا ومروحة كبيرة دون النظر إلى الفريم والـ ESC؟
    explanation: >
      لأن المروحة يجب أن تناسب مساحة الفريم وقدرة المحرك، والـ ESC يجب أن يتحمل
      التيار المطلوب. اختيار قطعة قوية وحدها قد يسبب عدم توافق أو مشاكل أداء وسلامة.

  - type: analysis
    level: beginner
    linkedConceptId: selection.component_matching
    status: draft
    question: >
      لماذا قد تؤدي بطارية أكبر إلى نتيجة أسوأ بدل أداء أفضل؟
    explanation: >
      لأن البطارية الأكبر قد تزيد الوزن وتؤثر في مركز الثقل والمساحة المتاحة،
      وقد لا تناسب الجهد أو التيار المطلوب للنظام.

