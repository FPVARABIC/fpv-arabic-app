architecturalNotes: |
  This is a selection concept about matching components as a system.
  It intentionally avoids exact part recipes, brand recommendations, wiring
  instructions, soldering, current calculations, Betaflight setup, or live
  troubleshooting. Detailed choices for frame, motor, propeller, ESC, battery,
  receiver, and video system belong in dedicated selection and hardware concepts.
