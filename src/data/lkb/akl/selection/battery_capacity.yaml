architecturalNotes: |
  This is a selection concept about choosing LiPo battery capacity.
  It intentionally excludes charging instructions, storage voltage, C-rating
  calculations, connector replacement, wiring, soldering, battery testing,
  product recommendations, and exact mAh tables.
  LiPo theory belongs in power.lipo_battery, flight-time modeling belongs in
  power.flight_time, and practical battery handling belongs in safety.lipo_handling.
