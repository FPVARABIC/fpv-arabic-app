definition:
  text: >
    اختيار سعة البطارية هو تحديد مقدار الطاقة المخزنة تقريبًا في البطارية، عادة
    بوحدة mAh، بما يوازن بين زمن الطيران والوزن والمساحة وهدف البناء.
  textEn: >
    Battery capacity selection is choosing the approximate stored energy amount,
    usually measured in mAh, while balancing flight time, weight, available space,
    and build goal.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    سعة أكبر قد تعطي زمن طيران أطول، لكنها غالبًا تزيد وزن البطارية وحجمها.
    بطارية ثقيلة جدًا قد تجعل الدرون أبطأ، أقل استجابة، أو أصعب في التحكم،
    وقد تقلل الفائدة الفعلية من السعة الإضافية. لذلك لا نختار أكبر mAh دائمًا،
    بل نختار سعة تناسب حجم الدرون، نظام الدفع، ومكان الاستخدام.
  textEn: >
    Higher capacity can give longer flight time, but it usually increases battery
    weight and size. A battery that is too heavy can make the drone slower, less
    responsive, harder to control, and may reduce the real benefit of the extra
    capacity. The best capacity is not always the largest mAh, but the one that
    fits the drone size, propulsion system, and use case.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم معنى سعة البطارية بوحدة mAh.
  - إدراك العلاقة بين السعة وزمن الطيران والوزن.
  - اختيار السعة كجزء من نظام متوافق وليس كرقم منفصل.

keyFacts:
  - mAh تعبر عن سعة البطارية، وليست وحدها مقياسًا للأداء الكامل.
  - زيادة السعة قد تزيد زمن الطيران لكنها تزيد الوزن والحجم غالبًا.
  - الوزن الزائد قد يقلل الاستجابة ويؤثر في مركز الثقل وكفاءة الطيران.
  - السعة المناسبة تعتمد على حجم الدرون، هدف البناء، ونظام الدفع.
  - Long Range قد يحتاج سعة أكبر، بينما Freestyle قد يفضل توازنًا بين الوزن والاستجابة.
  - البطارية يجب أن تناسب المساحة المتاحة على الفريم وطريقة تثبيتها الآمنة.
  - اختيار السعة يجب أن يراعي الجهد وC-rating والتيار المطلوب، وليس mAh فقط.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار سعة البطارية على مستوى التخطيط فقط. اختيار سعة غير
    مناسبة قد يؤثر في الوزن، مركز الثقل، تثبيت البطارية، وزمن الطيران. لا يتضمن
    هذا المفهوم شحن البطارية أو تخزينها أو توصيلها أو اختبارها. أي تعامل عملي
    مع بطاريات LiPo يجب أن يتم ضمن مفاهيم السلامة والطاقة والفحص المخصصة.
  blocksExternalProviders: false

misconceptions:
  - belief: أكبر mAh يعني دائمًا بطارية أفضل.
    correction: >
      السعة الأكبر قد تزيد زمن الطيران، لكنها تزيد الوزن والحجم وقد تجعل الدرون
      أقل استجابة أو غير متوازن.
    conceptLinked: flight.weight

  - belief: سعة البطارية وحدها تحدد زمن الطيران.
    correction: >
      زمن الطيران يعتمد أيضًا على الوزن، كفاءة نظام الدفع، أسلوب الطيران، الجهد،
      والمراوح والمحركات.
    conceptLinked: selection.component_matching

  - belief: أي بطارية كبيرة يمكن تركيبها إذا كان الجهد مناسبًا.
    correction: >
      حتى لو كان الجهد مناسبًا، يجب أن تناسب البطارية مساحة الفريم والوزن ومركز
      الثقل وطريقة التثبيت.
    conceptLinked: selection.frame_size

expectedQuestions:
  - ما معنى mAh في البطارية؟
  - كيف أختار سعة البطارية؟
  - هل السعة الأكبر تعني زمن طيران أطول دائمًا؟
  - هل البطارية الأكبر أفضل؟
  - ما علاقة سعة البطارية بوزن الدرون؟
  - ما علاقة السعة بزمن الطيران؟
  - هل سعة البطارية تؤثر في مركز الثقل؟
  - هل أختار سعة مختلفة للفريستايل والطيران البعيد؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.battery_capacity
    status: draft
    question: >
      لماذا قد لا تكون البطارية ذات السعة الأكبر هي الخيار الأفضل دائمًا؟
    explanation: >
      لأن السعة الأكبر غالبًا تزيد الوزن والحجم، وهذا قد يقلل الاستجابة ويؤثر
      في مركز الثقل وكفاءة الطيران، وقد يجعل الدرون أصعب في التحكم.

  - type: analysis
    level: beginner
    linkedConceptId: selection.battery_capacity
    status: draft
    question: >
      لماذا لا يمكن تقدير زمن الطيران من mAh وحدها؟
    explanation: >
      لأن زمن الطيران يتأثر بالوزن، كفاءة المحركات والمراوح، الجهد، أسلوب الطيران،
      وحجم الدرون، وليس بسعة البطارية وحدها.

