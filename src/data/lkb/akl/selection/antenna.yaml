  - ما الفرق بين SMA وRP-SMA؟
  - هل حجم الهوائي مهم؟
  - هل الهوائي يزيد المدى؟
  - هل يجب أن يطابق الهوائي VTX؟
  - هل أختار الهوائي قبل VTX؟

