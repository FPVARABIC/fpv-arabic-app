definition:
  text: >
    اختيار هوائي FPV هو اختيار هوائي متوافق مع نظام الفيديو وVTX ونوع الموصل
    والاستقطاب المناسب، بما يحقق أداءً مستقراً للإشارة ضمن منظومة الفيديو.
  textEn: >
    FPV antenna selection is choosing an antenna compatible with the video
    system, VTX, connector type, and polarization in order to achieve reliable
    signal performance within the FPV ecosystem.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    الهوائي ليس مجرد قطعة لزيادة المدى، بل جزء أساسي من منظومة الفيديو.
    يجب أن يتوافق مع VTX ونظام الفيديو ونوع الموصل والاستقطاب المناسب.
    اختيار هوائي غير متوافق قد يؤدي إلى ضعف الإشارة أو أداء غير جيد، حتى لو
    كانت بقية المكونات مناسبة.
  textEn: >
    The antenna is not simply an accessory for increasing range. It is an
    essential part of the FPV video system and must match the VTX, video system,
    connector type, and polarization. An incompatible antenna can reduce signal
    quality even if the remaining components are correct.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن الهوائي جزء من منظومة الفيديو وليس قطعة مستقلة.
  - إدراك أهمية توافق الموصل والاستقطاب مع VTX.
  - التمييز بين اختيار الهوائي وتركيبه العملي.

keyFacts:
  - يجب أن يتوافق الهوائي مع VTX.
  - نوع الموصل عامل توافق أساسي.
  - الاستقطاب يجب أن يكون مناسباً للمنظومة.
  - الهوائي لا يعمل بمعزل عن نظام الفيديو.
  - الهوائي المناسب يساعد على استقرار الإشارة.
  - زيادة المدى لا تعتمد على الهوائي وحده.
  - تركيب الهوائي وتشغيله العملي ينتميان إلى مفاهيم أخرى.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار الهوائي فقط. تشغيل VTX بدون هوائي أو تنفيذ اختبارات
    عملية أو تركيب الهوائي بشكل فعلي ينتمي إلى مفاهيم السلامة والتشغيل وليس إلى
    هذا المفهوم.
  blocksExternalProviders: false

misconceptions:
  - belief: أي هوائي يعمل مع أي VTX.
    correction: >
      يجب التحقق من توافق الموصل والاستقطاب ونظام الفيديو.
    conceptLinked: selection.vtx

  - belief: الهوائي الأكبر يعني دائماً مدى أفضل.
    correction: >
      الأداء يعتمد على المنظومة كاملة وليس على حجم الهوائي فقط.
    conceptLinked: selection.video_system

  - belief: الهوائي مجرد إكسسوار اختياري.
    correction: >
      الهوائي جزء أساسي من منظومة إرسال الفيديو.
    conceptLinked: selection.component_matching

expectedQuestions:
  - كيف أختار هوائي FPV؟
  - هل أي هوائي يعمل مع أي VTX؟
