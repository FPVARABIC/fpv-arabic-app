definition:
  text: >
    اختيار ESC هو اختيار وحدة التحكم في سرعة المحركات بما يتوافق مع
    المحركات، والبطارية، وFlight Controller، وهدف البناء.
  textEn: >
    ESC selection is choosing an electronic speed controller compatible with
    the motors, battery, flight controller, and build goal.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يتم اختيار ESC بشكل مستقل، بل كجزء من منظومة مكونات الدرون.
    يجب أن يتوافق مع المحركات، وجهد البطارية، وFlight Controller،
    وطبيعة البناء. اختيار ESC مناسب منذ البداية يساعد على بناء منظومة
    متوافقة ويقلل مشاكل التوافق لاحقاً.
  textEn: >
    An ESC should not be selected independently. It is one component of the
    overall drone system and must match the motors, battery voltage,
    flight controller, and build goal. Choosing a suitable ESC early
    improves overall compatibility.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن اختيار ESC يعتمد على توافق المنظومة كاملة.
  - إدراك العلاقة بين ESC والمحركات والبطارية وFlight Controller.
  - التمييز بين اختيار ESC وبين تركيبه أو إعداده.

keyFacts:
  - يجب أن يتوافق ESC مع المحركات.
  - يجب أن يتوافق ESC مع جهد البطارية.
  - يجب أن يتوافق ESC مع Flight Controller.
  - اختيار قيمة التيار يناقش في مفهوم مستقل.
  - يمكن اختيار ESC ضمن تصميم AIO أو Stack حسب طبيعة البناء.
  - لا يعني AIO أو Stack أن أحدهما أفضل دائماً.
  - التوصيل والإعداد والبرمجة تنتمي إلى مفاهيم مستقلة.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار ESC فقط، ولا يشمل التوصيل أو اللحام أو
    البرمجة أو الاختبارات العملية.
  blocksExternalProviders: false

misconceptions:
  - belief: أي ESC يعمل مع أي محرك.
    correction: >
      يجب أن يكون ESC متوافقاً مع المحركات وبقية المنظومة.
    conceptLinked: selection.component_matching

  - belief: اختيار أعلى قيمة تيار يعني دائماً أفضل ESC.
    correction: >
      قيمة التيار عامل واحد فقط ضمن عملية اختيار ESC، وليست العامل الوحيد.
    conceptLinked: selection.esc_current

  - belief: يمكن اختيار ESC دون مراعاة بقية المكونات.
    correction: >
      يجب اختيار ESC بما يتوافق مع المحركات والبطارية وFlight Controller
      وهدف البناء.
    conceptLinked: selection.build_goal

expectedQuestions:
  - كيف أختار ESC؟
  - هل أي ESC يعمل مع أي محرك؟
  - هل يجب أن يطابق ESC البطارية؟
  - هل يجب أن يطابق Flight Controller؟
  - ما الفرق بين AIO وStack؟
  - ما الذي يجب أن أراعيه عند اختيار ESC؟
  - هل قيمة التيار وحدها تكفي؟
  - متى أختار 4-in-1 ESC؟

