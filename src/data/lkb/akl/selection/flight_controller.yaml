definition:
  text: >
    اختيار Flight Controller هو اختيار متحكم طيران يتوافق مع حجم الدرون وهدف
    البناء والـ ESC والريسيفر ونظام الفيديو والملحقات والبرنامج الذي سيُستخدم
    لإعداده لاحقًا.
  textEn: >
    Flight controller selection is choosing a flight controller that fits the
    drone size, build goal, ESC, receiver, video system, accessories, and the
    firmware that will be used to configure it later.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    Flight Controller هو مركز التحكم الذي تتصل به عدة أنظمة في الدرون، لذلك
    لا يُختار فقط لأنه مشهور أو رخيص. يجب أن يملك المنافذ والجهود والمقاس
    والتوافق المناسب للـ ESC والريسيفر ونظام الفيديو والملحقات مثل GPS أو
    Buzzer. كذلك يجب أن يكون مناسبًا للبرنامج الذي ستستخدمه لاحقًا مثل
    Betaflight أو INAV. اختيار FC مناسب من البداية يقلل مشاكل التوافق عند
    التوصيل والإعداد.
  textEn: >
    The flight controller is the control hub that several drone systems connect
    to, so it should not be chosen only because it is popular or inexpensive.
    It must provide the ports, voltage outputs, size, and compatibility needed
    for the ESC, receiver, video system, and accessories such as GPS or a buzzer.
    It should also fit the firmware you plan to use later, such as Betaflight
    or INAV. Choosing a suitable FC early reduces compatibility problems during
    wiring and setup.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن Flight Controller يجب أن يناسب نظام الدرون كاملًا.
  - إدراك أهمية المنافذ والجهود والمقاس والتوافق قبل الشراء.
  - فهم أن دعم البرنامج مثل Betaflight أو INAV عامل اختيار، وليس خطوة إعداد في هذا المفهوم.
  - التمييز بين اختيار FC وإعداده أو توصيله عمليًا.

keyFacts:
  - Flight Controller يجب أن يتوافق مع حجم الدرون وهدف البناء.
  - عدد المنافذ مثل UARTs يؤثر في إمكانية توصيل الريسيفر وGPS ونظام الفيديو والملحقات.
  - توافق FC مع ESC مهم، خصوصًا عند استخدام Stack أو AIO.
  - بعض البوردات توفر BEC أو مخارج 5V و9V، لكن استخدامها العملي يحتاج مفاهيم توصيل منفصلة.
  - يجب التأكد أن FC مناسب للبرنامج المقصود مثل Betaflight أو INAV، لكن إعداد البرنامج موضوع منفصل.
  - AIO قد يناسب بعض البنايات الصغيرة لأنه يدمج أكثر من وظيفة في لوحة واحدة.
  - Stack قد يناسب بنايات تحتاج فصلًا أو توسعًا أكبر بين FC وESC.
  - اختيار FC يجب أن يراعي التوسع المستقبلي مثل GPS أو Buzzer أو Blackbox.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار Flight Controller فقط، لكنه مرتبط بتوافق الجهد
    والمنافذ والـ ESC والريسيفر ونظام الفيديو. لا يتضمن هذا المفهوم توصيل
    أسلاك أو لحام أو إعداد Firmware أو تشغيل الدرون. أي تطبيق عملي يجب أن يتم
    ضمن مفاهيم التوصيل والسلامة والإعداد المخصصة.
  blocksExternalProviders: false

misconceptions:
  - belief: أي Flight Controller يعمل مع أي بناء.
    correction: >
      يجب أن يتوافق FC مع حجم الدرون، ESC، الريسيفر، نظام الفيديو، والملحقات
      التي تريد استخدامها.
    conceptLinked: selection.component_matching

  - belief: عدد UARTs الكبير يعني دائمًا أن FC هو الأفضل.
    correction: >
      عدد المنافذ مهم، لكنه ليس العامل الوحيد؛ يجب أيضًا النظر إلى الحجم، الجهود،
      التوافق، الجودة، هدف البناء، ودعم البرنامج المناسب.
    conceptLinked: selection.build_goal

  - belief: AIO أفضل دائمًا من Stack لأنه أبسط.
    correction: >
      AIO قد يكون مناسبًا لبعض البنايات الصغيرة، لكن Stack قد يكون أنسب عندما
      تحتاج مرونة أو تحملًا أو توسعًا أكبر.
    conceptLinked: selection.drone_size

  - belief: إذا كان FC مشهورًا فهذا يعني أنه مناسب لأي Firmware.
    correction: >
      يجب التأكد من توافق FC مع البرنامج الذي تريد استخدامه، مثل Betaflight أو
      INAV، لأن دعم البرنامج جزء مهم من قرار الاختيار.
    conceptLinked: firmware.flight_controller_configuration

expectedQuestions:
  - كيف أختار Flight Controller؟
  - ما معنى FC؟
  - هل أي Flight Controller يناسب أي درون؟
  - ما أهمية عدد UARTs؟
  - ما الفرق بين AIO وStack؟
  - هل أحتاج 5V أو 9V في FC؟
  - هل FC يجب أن يناسب ESC؟
  - هل أختار FC قبل الريسيفر ونظام الفيديو؟
  - هل يجب أن أتأكد من دعم Betaflight أو INAV؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.flight_controller
    status: draft
    question: >
      لماذا لا يكفي اختيار Flight Controller لأنه مشهور أو رخيص؟
    explanation: >
      لأن FC يجب أن يناسب النظام كاملًا من ناحية الحجم، المنافذ، الجهود،
      التوافق مع ESC والريسيفر ونظام الفيديو والملحقات، ودعم البرنامج المناسب.

  - type: analysis
    level: beginner
    linkedConceptId: selection.flight_controller
    status: draft
    question: >
      لماذا قد يكون عدد UARTs عاملًا مهمًا عند اختيار FC؟
    explanation: >
      لأن الريسيفر وGPS وبعض أنظمة الفيديو والملحقات قد تحتاج منافذ اتصال،
      وإذا لم تكن المنافذ كافية قد تصبح الإضافات المستقبلية صعبة أو مستحيلة.

