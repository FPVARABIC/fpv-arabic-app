architecturalNotes: |
  This is a selection concept about choosing a flight controller.
  It intentionally excludes wiring, soldering, pin mapping, UART assignment,
  firmware flashing, Betaflight setup, INAV setup, sensor calibration, PID tuning,
  and product reviews.
  Hardware explanation belongs in hardware.flight_controller, UART mapping belongs
  in firmware.uart_configuration, and firmware setup belongs in
  firmware.flight_controller_configuration.
