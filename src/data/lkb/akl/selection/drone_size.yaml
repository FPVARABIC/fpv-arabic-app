definition:
  text: >
    اختيار حجم الدرون هو قرار يحدد فئة الفريم والمراوح والقطع المناسبة بناءً
    على هدف البناء ومكان الطيران ومستوى المتعلم.
  textEn: >
    Drone size selection is the decision that defines the frame class, propeller
    size, and suitable components based on the build goal, flying environment,
    and learner level.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    حجم الدرون لا يعني حجم الفريم فقط، بل يؤثر في المراوح، المحركات، البطارية،
    الوزن، زمن الطيران، القوة، وطريقة الاستخدام. درون 5 إنش شائع للفريستايل،
    ودرون 7 إنش يناسب غالبًا الطيران البعيد، بينما Cinewhoop يركز على التصوير
    القريب مع حماية المراوح، والأحجام الصغيرة مثل 3 إنش أو Toothpick قد تكون
    أخف وأقل تكلفة لكنها ليست مناسبة لكل هدف.
  textEn: >
    Drone size is not only the physical frame size; it affects propellers, motors,
    battery, weight, flight time, power, and use case. A 5-inch drone is common
    for freestyle, a 7-inch drone is often used for long range, cinewhoops focus
    on close-range filming with prop protection, and smaller sizes such as 3-inch
    or toothpick builds can be lighter and lower-cost but are not suitable for every goal.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن حجم الدرون يؤثر في معظم اختيارات القطع.
  - التمييز بين الأحجام الشائعة مثل 3 إنش و5 إنش و7 إنش وCinewhoop.
  - ربط حجم الدرون بهدف البناء وبيئة الطيران ومستوى المتعلم.

keyFacts:
  - حجم الدرون يرتبط غالبًا بحجم المراوح التي يستطيع الفريم حملها.
  - 5 إنش شائع في الفريستايل لأنه يوازن بين القوة، الاستجابة، وتوفر القطع.
  - 7 إنش يستخدم غالبًا للطيران البعيد لأنه يسمح بكفاءة ومدى أكبر عند التصميم الصحيح.
  - Cinewhoop يستخدم حماية للمراوح ويخدم التصوير القريب، لكنه لا يلغي قواعد السلامة.
  - الأحجام الصغيرة قد تكون مناسبة للتدريب أو الأماكن المحدودة، لكنها تملك تنازلات في القوة والثبات وحمل الوزن.
  - مكان الطيران والمساحة المتاحة يؤثران في اختيار الحجم، لأن الدرونات الأكبر أو الأسرع تحتاج مساحة أوسع وهامش أمان أكبر.
  - لا يوجد حجم أفضل دائمًا؛ الحجم الصحيح يعتمد على الهدف والبيئة والميزانية والخبرة.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار الحجم فقط، ولا يعني أن أي حجم مناسب للطيران في أي
    مكان. اختيار حجم أكبر أو أسرع قد يزيد المخاطر والمساحة المطلوبة للطيران.
    أي قرار عملي يجب أن يراعي قواعد السلامة والقوانين المحلية وبيئة الطيران.
  blocksExternalProviders: false

misconceptions:
  - belief: حجم 5 إنش هو الخيار الأفضل لكل مبتدئ دائمًا.
    correction: >
      5 إنش شائع ومهم في FPV، لكنه ليس دائمًا أفضل خيار لكل مبتدئ. الهدف، المكان،
      الميزانية، والخبرة قد تجعل حجمًا أصغر أو Cinewhoop أكثر مناسبة.
    conceptLinked: selection.build_goal

  - belief: كلما كان الدرون أكبر كان أفضل.
    correction: >
      الحجم الأكبر قد يعطي مدى أو حملًا أفضل في بعض الحالات، لكنه يزيد الوزن
      والمساحة المطلوبة والمخاطر والتكلفة.
    conceptLinked: selection.drone_size

  - belief: Cinewhoop آمن للطيران قرب الناس لأنه يملك حماية للمراوح.
    correction: >
      حماية المراوح تقلل بعض المخاطر لكنها لا تجعل الطيران قرب الناس آمنًا
      تلقائيًا أو مسموحًا في كل مكان.
    conceptLinked: safety.first_safe_flight

expectedQuestions:
  - كيف أختار حجم الدرون؟
  - هل أبدأ بدرون 5 إنش؟
  - ما الفرق بين 3 إنش و5 إنش و7 إنش؟
  - متى أختار Cinewhoop؟
  - ما الحجم المناسب للفريستايل؟
  - ما الحجم المناسب للطيران البعيد؟
  - هل الدرون الأكبر أفضل دائمًا؟
  - هل الحجم يؤثر في اختيار المحركات والبطارية؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.drone_size
    status: draft
    question: >
      لماذا لا يمكن اختيار حجم الدرون قبل تحديد هدف البناء؟
    explanation: >
      لأن كل هدف يحتاج خصائص مختلفة. الفريستايل، الطيران البعيد، السباق،
      والتصوير القريب لا تستخدم نفس الحجم أو نفس تنازلات التصميم.

  - type: analysis
    level: beginner
    linkedConceptId: selection.drone_size
    status: draft
    question: >
      لماذا قد لا يكون الدرون الأكبر هو الخيار الأفضل للمبتدئ؟
    explanation: >
      لأن الحجم الأكبر قد يزيد الوزن والتكلفة والمخاطر والمساحة المطلوبة، وقد
      يجعل التعلم أصعب إذا لم يكن مناسبًا لهدف المتعلم وبيئة الطيران.

