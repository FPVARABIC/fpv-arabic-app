architecturalNotes: |
  This is a selection concept, not a frame or propeller specification.
  It explains how drone size acts as an early build-planning decision.
  It intentionally avoids exact shopping lists, brand recommendations, fixed part
  recipes, legal advice, flight procedures, and installation instructions.
  Detailed frame, motor, propeller, battery, and compatibility choices belong in
  dedicated selection and hardware concepts.
