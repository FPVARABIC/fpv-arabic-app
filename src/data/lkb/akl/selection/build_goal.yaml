architecturalNotes: |
  This is a selection concept, not a hardware component description.
  It explains how the intended use of the drone guides later size and component
  choices. It intentionally avoids exact shopping recommendations, brand names,
  part lists, installation instructions, firmware setup, or flight procedures.
