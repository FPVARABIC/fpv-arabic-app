architecturalNotes: |
  This is a selection concept about choosing motor size.
  It intentionally excludes motor KV selection, exact current calculations,
  thrust stand data, product lists, brand recommendations, wiring, soldering,
  motor testing, propeller installation, and Betaflight motor setup.
  Motor function belongs in hardware.motor, while KV, propeller size, ESC current,
  and detailed compatibility belong in dedicated selection concepts.
