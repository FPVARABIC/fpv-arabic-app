definition:
  text: >
    اختيار وحدة GPS هو اختيار وحدة تحديد مواقع تتوافق مع هدف البناء وFlight
    Controller والوظائف التي يرغب المستخدم في إضافتها إلى الدرون.
  textEn: >
    GPS module selection is choosing a positioning module compatible with the
    build goal, flight controller, and the desired drone capabilities.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    ليست كل الدرونات تحتاج إلى GPS. يعتمد القرار على هدف البناء والوظائف التي
    يريد المستخدم إضافتها. إذا لم تكن هناك حاجة لهذه الوظائف، فقد لا تكون إضافة
    GPS ضرورية منذ البداية.
  textEn: >
    Not every drone requires a GPS module. The decision depends on the build
    goal and the functions the user wants to add. If those functions are not
    needed, installing a GPS module may not be necessary.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن GPS ليس مكوناً إلزامياً لكل بناء.
  - إدراك أن اختيار GPS يعتمد على هدف البناء.
  - التمييز بين اختيار وحدة GPS وبين تركيبها أو إعدادها.

keyFacts:
  - بعض البنايات لا تحتاج إلى GPS.
  - هدف البناء هو العامل الأساسي في قرار إضافة GPS.
  - يجب أن تتوافق وحدة GPS مع Flight Controller.
  - حجم الوحدة قد يؤثر في بعض البنايات الصغيرة.
  - وجود GPS لا يعني أن جميع الوظائف المعتمدة عليه ستكون متاحة تلقائياً.
  - إعداد GPS ووظائفه العملية تنتمي إلى مفاهيم مستقلة.
  - اختيار GPS يسبق مرحلة الإعداد البرمجي.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار وحدة GPS فقط، ولا يشمل تركيبها أو إعدادها أو
    استخدام الوظائف العملية المرتبطة بها.
  blocksExternalProviders: false

misconceptions:
  - belief: كل درون يحتاج إلى GPS.
    correction: >
      الحاجة إلى GPS تعتمد على هدف البناء والاستخدام المتوقع.
    conceptLinked: selection.build_goal

  - belief: وجود GPS وحده يوفر جميع الوظائف المرتبطة به.
    correction: >
      اختيار الوحدة يختلف عن إعدادها واستخدام ميزاتها.
    conceptLinked: selection.flight_controller

  - belief: يمكن اختيار أي GPS لأي بناء.
    correction: >
      يجب مراعاة توافق الوحدة مع Flight Controller وبقية المنظومة.
    conceptLinked: selection.component_matching

expectedQuestions:
  - هل أحتاج GPS؟
  - متى أضيف GPS إلى الدرون؟
  - هل كل الدرونات تحتاج GPS؟
  - هل GPS ضروري للمبتدئ؟
  - هل أي GPS يعمل مع أي Flight Controller؟
  - هل GPS يزيد مدى الطيران؟
  - هل وجود GPS وحده يكفي للاستفادة من جميع وظائفه؟
  - متى أختار وحدة GPS؟

