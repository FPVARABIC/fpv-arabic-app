architecturalNotes: |
  This is a selection concept about choosing a receiver communication protocol.
  It intentionally excludes receiver hardware description, binding procedures,
  firmware flashing, UART wiring, Betaflight configuration, range testing,
  antenna installation, and failsafe configuration.
  Hardware details belong in hardware.receiver, radio operation belongs in
  control.radio_transmitter, and configuration belongs in firmware.receiver_configuration.
