definition:
  text: >
    اختيار مستقبل الإشارة هو اختيار Receiver متوافق مع بروتوكول التحكم
    وFlight Controller وهدف البناء ومتطلبات الاعتمادية والمدى.
  textEn: >
    Receiver selection is choosing a receiver compatible with the selected
    radio protocol, flight controller, build goal, and the required
    reliability and operating range.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يتم اختيار الريسيفر بشكل مستقل، بل يجب أن يكون متوافقاً مع بروتوكول
    التحكم وFlight Controller وهدف البناء. اختيار Receiver مناسب من البداية
    يساعد على بناء منظومة تحكم متوافقة ويقلل مشاكل التوافق لاحقاً.
  textEn: >
    A receiver should not be selected independently. It must match the chosen
    radio protocol, flight controller, and build goal. Selecting a compatible
    receiver from the beginning helps create a reliable control system and
    reduces future compatibility issues.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن اختيار الريسيفر يعتمد على بروتوكول التحكم.
  - إدراك أهمية توافق الريسيفر مع Flight Controller.
  - التمييز بين اختيار الريسيفر وبين تركيبه أو إعداده.

keyFacts:
  - يجب أن يتوافق الريسيفر مع بروتوكول التحكم المختار.
  - يجب أن يكون الريسيفر متوافقاً مع Flight Controller.
  - اختيار البروتوكول يسبق اختيار الريسيفر.
  - الاعتمادية والمدى يؤثران في قرار الاختيار.
  - حجم الريسيفر قد يؤثر في بعض البنايات الصغيرة.
  - الميزات الإضافية ليست ضرورية لكل بناء.
  - التوصيل والإعداد والـ Binding تنتمي إلى مفاهيم مستقلة.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار الريسيفر فقط، ولا يتضمن التوصيل أو الـ Binding
    أو إعداد Firmware أو أي إجراءات تشغيل عملية.
  blocksExternalProviders: false

misconceptions:
  - belief: أي Receiver يعمل مع أي بروتوكول.
    correction: >
      يجب أن يتوافق الريسيفر مع بروتوكول التحكم المختار.
    conceptLinked: selection.receiver_protocol

  - belief: أصغر Receiver هو الأفضل دائماً.
    correction: >
      الحجم عامل واحد فقط، ويجب موازنته مع التوافق والاعتمادية وهدف البناء.
    conceptLinked: selection.build_goal

  - belief: يمكن اختيار الريسيفر دون مراعاة Flight Controller.
    correction: >
      يجب أن يكون الريسيفر متوافقاً مع Flight Controller وبقية منظومة التحكم.
    conceptLinked: selection.flight_controller

expectedQuestions:
  - كيف أختار Receiver؟
  - كيف أعرف أن هذا Receiver يدعم ELRS؟
  - هل يجب أن يطابق الريسيفر Flight Controller؟
  - هل أختار البروتوكول أم الريسيفر أولاً؟
  - هل حجم الريسيفر مهم؟
  - هل أحتاج Receiver بمدى كبير؟
  - هل جميع الريسيفرات متشابهة؟
  - هل أحتاج Receiver Nano؟

