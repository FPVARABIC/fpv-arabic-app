architecturalNotes: |
  This is a selection concept about choosing an FPV camera.
  It intentionally excludes camera wiring, mounting steps, lens adjustment,
  image tuning, firmware configuration, product reviews, and detailed sensor
  specifications. Camera function belongs in hardware.camera, VTX selection
  belongs in selection.vtx, and practical installation belongs in safety or
  assembly procedure nodes.
