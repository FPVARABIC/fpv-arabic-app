definition:
  text: >
    اختيار الجرس هو تحديد ما إذا كان البناء يحتاج إلى Buzzer مناسب يساعد في
    التنبيه أو العثور على الدرون، مع مراعاة توافقه مع Flight Controller وهدف البناء.
  textEn: >
    Buzzer selection is deciding whether a build needs a suitable buzzer for
    alerts or lost-model recovery, while considering compatibility with the
    flight controller and build goal.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    الجرس ليس مكوناً إلزامياً في كل بناء، لكنه قد يكون مفيداً جداً للتنبيه
    أو العثور على الدرون إذا سقط في مكان يصعب رؤيته. يعتمد اختياره على هدف
    البناء، وبيئة الطيران، ومدى الحاجة إلى ميزة العثور على الدرون.
  textEn: >
    A buzzer is not mandatory in every build, but it can be very useful for
    alerts or finding a drone after it lands or crashes in a hard-to-see area.
    The decision depends on the build goal, flying environment, and the need
    for lost-model recovery.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن الجرس ليس مكوناً إلزامياً في كل بناء.
  - إدراك أن اختيار الجرس يعتمد على هدف البناء وبيئة الطيران.
  - التمييز بين اختيار الجرس وبين توصيله أو إعداده.

keyFacts:
  - الجرس يساعد في التنبيه أو العثور على الدرون.
  - ليست كل البنايات تحتاج إلى جرس.
  - بيئة الطيران تؤثر في الحاجة إلى الجرس.
  - بعض أنواع الجرس تحتوي على بطارية داخلية، وبعضها يعتمد على تغذية الدرون.
  - يجب أن يكون الجرس متوافقاً مع Flight Controller.
  - اختيار الجرس لا يغني عن إعدادات السلامة المناسبة.
  - التوصيل والإعداد وأنماط التشغيل تنتمي إلى مفاهيم مستقلة.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار الجرس فقط، ولا يتضمن توصيله أو إعداد أوضاعه أو
    استخدامه كجزء من إجراء عملي للعثور على الدرون.
  blocksExternalProviders: false

misconceptions:
  - belief: كل بناء FPV يحتاج إلى جرس.
    correction: >
      يعتمد اختيار الجرس على هدف البناء وبيئة الطيران ومتطلبات المستخدم، وليس
      جميع البنايات تحتاج إليه.
    conceptLinked: selection.build_goal

  - belief: أي جرس يعمل مع أي Flight Controller.
    correction: >
      يجب التأكد من توافق الجرس مع Flight Controller ومتطلبات البناء.
    conceptLinked: selection.flight_controller

  - belief: وجود الجرس وحده يكفي لاستعادة الدرون المفقود.
    correction: >
      الجرس وسيلة مساعدة فقط، ولا يغني عن اختيار المكونات المناسبة أو وسائل
      السلامة الأخرى.
    conceptLinked: selection.component_matching

expectedQuestions:
  - هل أحتاج إلى Buzzer؟
  - هل كل الدرونات تحتاج إلى جرس؟
  - كيف أختار جرس الدرون؟
  - ما الفرق بين الجرس العادي والجرس المزود ببطارية؟
  - هل الجرس يساعد في العثور على الدرون؟
  - هل أي Buzzer يعمل مع أي Flight Controller؟
  - متى يكون الجرس مفيداً؟
  - هل يمكن الطيران بدون جرس؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.buzzer
    status: draft
    question: >
      لماذا قد يحتاج أحد البنايات إلى جرس بينما لا يحتاجه بناء آخر؟
    explanation: >
      لأن قرار اختيار الجرس يعتمد على هدف البناء وبيئة الاستخدام وليس على
      وجود قاعدة واحدة لجميع الدرونات.

  - type: analysis
    level: beginner
    linkedConceptId: selection.buzzer
    status: draft
    question: >
      لماذا لا يكفي اختيار أي جرس بشكل عشوائي؟
    explanation: >
      لأن الجرس يجب أن يكون متوافقاً مع Flight Controller ومتطلبات البناء.

