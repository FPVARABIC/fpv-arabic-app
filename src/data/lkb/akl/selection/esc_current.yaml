challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.esc_current
    status: draft
    question: >
      لماذا لا يكفي أن تختار ESC فقط لأنه يستطيع تدوير المحرك على الطاولة؟
    explanation: >
      لأن الاستخدام الفعلي قد يطلب تيارًا أعلى أثناء التسارع أو المناورات، وقد
      يسخن ESC أو يتلف إذا لم يكن مناسبًا للنظام الكامل.

  - type: analysis
    level: beginner
    linkedConceptId: selection.esc_current
    status: draft
    question: >
      لماذا قد لا يكون اختيار أعلى أمبير ESC دائمًا هو القرار الأفضل؟
    explanation: >
      لأن ESC المبالغ فيه قد يزيد الوزن والتكلفة دون فائدة حقيقية إذا كان النظام
      لا يحتاج إلى ذلك الهامش، بينما المطلوب هو توافق مناسب مع هامش أمان معقول.

