definition:
  text: >
    اختيار تيار ESC هو اختيار متحكم سرعة يستطيع تحمل التيار المتوقع من المحركات
    والمراوح والبطارية مع هامش أمان مناسب، دون إجهاد حراري أو كهربائي غير ضروري.
  textEn: >
    ESC current selection is choosing a speed controller that can handle the
    expected current from the motors, propellers, and battery with an appropriate
    safety margin, without unnecessary electrical or thermal stress.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    الـ ESC لا يختار فقط لأنه "يشتغل" مع المحرك، بل يجب أن يتحمل التيار الذي
    قد يطلبه نظام الدفع أثناء التسارع أو المناورات. محركات أكبر، مراوح أثقل،
    KV غير مناسب، أو جهد بطارية أعلى قد ترفع التيار والحرارة. لذلك نختار ESC
    بقدرة مناسبة للنظام كاملًا، وليس بناءً على رقم واحد منفصل.
  textEn: >
    An ESC is not chosen only because it can make a motor spin; it must handle
    the current the propulsion system may demand during acceleration or maneuvers.
    Larger motors, heavier propellers, unsuitable KV, or higher battery voltage
    can increase current and heat. The ESC should be selected for the whole system,
    not from a single number in isolation.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن تيار ESC يجب أن يناسب المحركات والمراوح والبطارية.
  - إدراك أهمية هامش الأمان في اختيار ESC.
  - التمييز بين رقم الأمبير المعلن وبين ملاءمة ESC للنظام الكامل.

keyFacts:
  - ESC يجب أن يتحمل التيار المتوقع من المحرك والمروحة والبطارية.
  - المراوح الأكبر أو الأعلى حملًا قد تزيد التيار المطلوب من المحركات.
  - KV غير مناسب أو جهد بطارية أعلى قد يرفعان التيار والحرارة.
  - اختيار ESC بهامش أمان مناسب يقلل خطر السخونة أو التلف.
  - رقم الأمبير وحده لا يكفي؛ يجب النظر إلى الجهد المدعوم، الجودة، التبريد، ونوع الاستخدام.
  - ESC ضعيف بالنسبة للنظام قد يؤدي إلى فقدان قدرة، سخونة، تلف، أو فشل أثناء الطيران.
  - ESC قوي جدًا قد يعمل، لكنه قد يزيد التكلفة أو الوزن دون فائدة حقيقية إذا كان مبالغًا فيه.

safety:
  level: high
  reviewed: false
  notes: >
    هذا المفهوم مرتبط مباشرة بقرارات تيار وجهد وحرارة قد تؤثر في سلامة النظام.
    لا يتضمن هذا المفهوم توصيل ESC أو لحام أسلاك أو اختبار محركات أو تركيب مراوح.
    أي تطبيق عملي يجب أن يتم ضمن مفاهيم السلامة والفحص المخصصة، مع احترام حدود
    الجهد والتيار وتجنب تشغيل المحركات أو البطارية خارج سياق آمن.
  blocksExternalProviders: false

misconceptions:
  - belief: أي ESC يجعل المحرك يدور فهو مناسب.
    correction: >
      دوران المحرك لا يعني أن ESC مناسب. يجب أن يتحمل التيار والجهد والحرارة
      المتوقعة أثناء الاستخدام الفعلي.
    conceptLinked: selection.component_matching

  - belief: اختيار ESC بأعلى أمبير دائمًا هو الأفضل.
    correction: >
      ESC أعلى من الحاجة قد يعطي هامشًا، لكنه قد يزيد الوزن والتكلفة دون فائدة
      إذا كان مبالغًا فيه بالنسبة للنظام.
    conceptLinked: selection.esc_current

  - belief: تيار ESC لا علاقة له بالمراوح أو KV.
    correction: >
      حجم المروحة وحملها وKV المحرك وجهد البطارية كلها تؤثر في التيار الذي
      يجب أن يتحمله ESC.
    conceptLinked: selection.motor_kv

