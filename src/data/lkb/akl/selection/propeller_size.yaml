architecturalNotes: |
  This is a selection concept about choosing propeller size.
  It intentionally excludes propeller installation, CW/CCW direction,
  balancing, tightening methods, motor testing, thrust measurements,
  product recommendations, and performance tables.
  Propeller function belongs in hardware.propeller, while installation,
  testing, and injury prevention belong in dedicated safety concepts.
