definition:
  text: >
    اختيار نظام التليمتري هو تحديد الحاجة إلى نظام مناسب لنقل بيانات الدرون
    أثناء التشغيل بما يتوافق مع متطلبات البناء ومنظومة التحكم المختارة.
  textEn: >
    Telemetry selection is deciding whether a build requires a suitable
    telemetry solution based on the build requirements and the selected
    control system.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    قد يحتاج بعض المستخدمين إلى استقبال بيانات من الدرون أثناء التشغيل،
    بينما لا يحتاج جميع المبتدئين إلى ذلك. يعتمد قرار اختيار نظام
    التليمتري على هدف البناء، ومنظومة التحكم المختارة، ومدى الحاجة
    إلى هذه البيانات، وليس على وجودها في جميع البنايات.
  textEn: >
    Some users need to receive data from the drone during operation,
    while many beginners do not. Choosing a telemetry system depends
    on the build goal, the selected control system, and whether this
    information is actually needed.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن نظام التليمتري يمثل قرار اختيار مستقل.
  - إدراك أن الحاجة إلى التليمتري تختلف باختلاف هدف البناء.
  - التمييز بين اختيار نظام التليمتري وبين تركيبه أو توصيله أو إعداده.

keyFacts:
  - ليست جميع البنايات تحتاج إلى نظام تليمتري إضافي.
  - قد توفر بعض منظومات التحكم إمكانيات تليمتري دون الحاجة إلى مكونات إضافية.
  - قد تتطلب بعض الاستخدامات حلول تليمتري إضافية.
  - يعتمد اختيار نظام التليمتري على هدف البناء.
  - يجب أن يكون نظام التليمتري متوافقاً مع بقية مكونات المنظومة.
  - إعداد نظام التليمتري مفهوم مستقل عن قرار اختياره.
  - تفاصيل البروتوكولات والإعدادات البرمجية تنتمي إلى مفاهيم مستقلة.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح قرار اختيار نظام التليمتري فقط، ولا يتضمن أي توصيل
    عملي أو إعداد برمجي أو تشغيل فعلي.
  blocksExternalProviders: false

misconceptions:
  - belief: كل بناء FPV يحتاج إلى تليمتري إضافي.
    correction: >
      ليست جميع البنايات تحتاج إلى تليمتري إضافي؛ القرار يعتمد على هدف البناء
      وما توفره منظومة التحكم المختارة.
    conceptLinked: selection.build_goal

  - belief: اختيار الريسيفر يكفي دائمًا لتغطية كل احتياجات التليمتري.
    correction: >
      قد توفر بعض منظومات التحكم تليمتري كافيًا، لكن بعض الاستخدامات قد تحتاج
      حلاً إضافيًا أو تخطيطًا مختلفًا.
    conceptLinked: selection.receiver

  - belief: التليمتري يعني فقط إعدادًا برمجيًا.
    correction: >
      اختيار التليمتري يبدأ كقرار توافق واحتياج، أما الإعداد البرمجي فينتمي
      إلى مفاهيم Firmware منفصلة.
    conceptLinked: selection.component_matching

expectedQuestions:
  - هل أحتاج إلى Telemetry؟
  - ما معنى التليمتري في الدرون؟
  - هل كل درون يحتاج تليمتري؟
  - هل ELRS يوفر تليمتري كافي؟
  - هل أحتاج مكون تليمتري إضافي؟
  - ما علاقة التليمتري بالريسيفر؟
  - هل التليمتري إعداد برمجي فقط؟
  - متى يكون التليمتري مهمًا؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.telemetry
    status: draft
    question: >
      لماذا لا يحتاج كل بناء FPV إلى نظام تليمتري إضافي؟
    explanation: >
      لأن الحاجة إلى التليمتري تعتمد على هدف البناء وما توفره منظومة التحكم
      المختارة من إمكانيات.

  - type: analysis
    level: beginner
    linkedConceptId: selection.telemetry
    status: draft
    question: >
      لماذا لا يجب اعتبار التليمتري مجرد إعداد برمجي فقط؟
    explanation: >
      لأن اختيار التليمتري يبدأ من قرار الحاجة والتوافق، ثم تأتي الإعدادات
      البرمجية لاحقًا في مفاهيم مستقلة.

