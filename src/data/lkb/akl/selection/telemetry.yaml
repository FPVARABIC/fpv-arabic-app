architecturalNotes: |
  This is a selection concept about deciding whether telemetry capability is
  needed and whether the selected control system provides enough telemetry for
  the build goal.
  It intentionally excludes protocol details such as CRSF, MSP, MAVLink, or
  SmartPort configuration, wiring, UART setup, Betaflight or INAV telemetry
  setup, ground station software, OSD configuration, Blackbox logging,
  troubleshooting, and product recommendations.
  Receiver protocol selection belongs in selection.receiver_protocol.
  Receiver selection belongs in selection.receiver.
  Telemetry hardware description belongs in hardware.telemetry_module.
  Telemetry configuration belongs in firmware.telemetry_configuration.
