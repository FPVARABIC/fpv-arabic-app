  knowledgeOrigin: >
    Canonical selection concept authored from FPV video-system fundamentals
    and organized for AKL.
  extractionNotes: >
    This concept explains how to choose an FPV video ecosystem based on
    compatibility, image quality, latency, budget, upgrade path, and build goal.
    It intentionally excludes camera specifications, VTX configuration,
    goggles setup, frequencies, channels, transmission power, and firmware.

