definition:
  text: >
    اختيار نظام الفيديو هو اختيار منظومة FPV التي تنقل الصورة من الدرون إلى
    النظارة أو الشاشة بما يتوافق مع هدف البناء والميزانية ومتطلبات الأداء
    والتوافق بين مكونات النظام.
  textEn: >
    Video system selection is choosing the FPV ecosystem that transmits video
    from the drone to goggles or a display while matching the build goal,
    budget, performance requirements, and component compatibility.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    نظام الفيديو ليس مجرد كاميرا أو جهاز إرسال فيديو، بل هو منظومة كاملة
    تتكون من كاميرا وVTX وجهاز استقبال داخل النظارة أو الشاشة، ويجب أن تعمل
    جميع هذه المكونات ضمن نظام متوافق واحد. تختلف أنظمة الفيديو في جودة الصورة،
    وزمن التأخير، والتكلفة، وسهولة الترقية، لذلك لا يوجد نظام واحد هو الأفضل
    لجميع المستخدمين.
  textEn: >
    An FPV video system is not just a camera or a video transmitter. It is a
    complete ecosystem made of a camera, a VTX, and a compatible receiver inside
    the goggles or display. All of these parts must work inside one compatible
    system. Video systems differ in image quality, latency, cost, and upgrade
    path, so no single system is best for every user.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن نظام الفيديو عبارة عن منظومة متكاملة وليس قطعة واحدة.
  - التعرف على أهم معايير اختيار نظام الفيديو.
  - إدراك أن التوافق والنظام البيئي أهم من اختيار أغلى نظام.

keyFacts:
  - نظام الفيديو يتكون من كاميرا وVTX وجهاز استقبال متوافق داخل النظارة أو الشاشة.
  - تنقسم أنظمة FPV الحديثة بصورة عامة إلى أنظمة تناظرية Analog وأنظمة رقمية Digital، ثم تختلف الأنظمة داخل كل فئة.
  - تختلف الأنظمة في جودة الصورة وزمن التأخير والسعر وإمكانية الترقية.
  - اختيار نظام الفيديو يعني أيضًا اختيار نظام بيئي Ecosystem قد يؤثر في توافق المكونات وإمكانية الترقية مستقبلًا.
  - تغيير نظام الفيديو لاحقًا قد يتطلب استبدال عدة مكونات في المنظومة.
  - النظام المناسب يعتمد على هدف البناء والميزانية والتوافق بين المكونات.
  - لا يوجد نظام فيديو واحد هو الأفضل لجميع المستخدمين.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار نظام الفيديو فقط، ولا يتضمن تشغيل أجهزة الإرسال،
    أو ضبط قدرة الإرسال، أو تركيب الهوائيات، أو إعداد الترددات، أو أي إجراءات
    عملية خاصة بالطيران أو بالـ VTX.
  blocksExternalProviders: false

misconceptions:
  - belief: أغلى نظام فيديو هو دائمًا أفضل اختيار.
    correction: >
      النظام الأفضل هو الذي يناسب هدف البناء وميزانيتك ويحقق التوافق مع بقية
      مكونات المشروع.
    conceptLinked: selection.build_goal

  - belief: يمكن تركيب أي كاميرا أو VTX أو نظارة مع أي نظام فيديو.
    correction: >
      كل نظام فيديو يعتمد على منظومة متوافقة، لذلك يجب التأكد من توافق
      الكاميرا وVTX والنظارة قبل الشراء.
    conceptLinked: selection.component_matching

  - belief: جودة الصورة هي العامل الوحيد الذي يحدد أفضل نظام فيديو.
    correction: >
      يجب أيضًا مراعاة زمن التأخير، والميزانية، والتوافق، وإمكانية الترقية،
      وتوفر القطع.
    conceptLinked: selection.component_matching

expectedQuestions:
  - ما هو نظام الفيديو في الدرون؟
  - ما الفرق بين Analog والأنظمة الرقمية؟
  - هل DJI أفضل من Walksnail؟
  - هل HDZero مناسب للمبتدئين؟
  - كيف أختار نظام الفيديو؟
  - هل أستطيع تغيير نظام الفيديو لاحقًا؟
  - هل جميع الكاميرات تعمل مع جميع أجهزة VTX والنظارات؟
  - لماذا يجب اختيار النظام قبل شراء مكوناته؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.video_system
    status: draft
    question: >
      لماذا يجب اختيار نظام الفيديو قبل شراء الكاميرا والـ VTX والنظارة؟
    explanation: >
      لأن الكاميرا والـ VTX والنظارة يجب أن تعمل ضمن منظومة متوافقة، واختيار
      النظام أولًا يمنع شراء مكونات غير متوافقة.

  - type: analysis
    level: beginner
    linkedConceptId: selection.video_system
    status: draft
    question: >
      لماذا لا تكون جودة الصورة وحدها كافية لاختيار نظام الفيديو؟
    explanation: >
      لأن زمن التأخير، والتوافق، والميزانية، وإمكانية الترقية عوامل تؤثر أيضًا
      في القرار النهائي.

