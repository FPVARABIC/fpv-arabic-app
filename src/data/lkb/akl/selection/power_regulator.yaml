  This is a selection concept about choosing a power regulator such as a BEC or UBEC.
  It intentionally excludes wiring, soldering, current calculations, regulator
  design, efficiency theory, voltage testing, heat testing, firmware configuration,
  troubleshooting, and product reviews.
  Hardware explanation belongs in hardware.power_regulator.
