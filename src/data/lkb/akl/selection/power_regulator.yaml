definition:
  text: >
    اختيار منظم الجهد هو تحديد الحاجة إلى منظم جهد مناسب لتوفير تغذية
    كهربائية متوافقة للمكونات التي تحتاج جهداً منظماً ضمن منظومة الدرون.
  textEn: >
    Power regulator selection is deciding whether a suitable voltage
    regulator is required to provide compatible regulated power for
    drone components.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا تعمل جميع مكونات الدرون على نفس الجهد الكهربائي، لذلك قد تحتاج بعض
    المكونات إلى منظم جهد مناسب. يعتمد هذا القرار على منظومة الطاقة
    والمكونات المستخدمة، ولا يعني وجود منظم جهد أنه ضروري في كل بناء.
  textEn: >
    Not all drone components operate at the same voltage. Some may require
    a suitable voltage regulator. The decision depends on the overall power
    system and the components being used, and a regulator is not required
    for every build.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن بعض مكونات الدرون تحتاج إلى جهد منظم ومتوافق.
  - إدراك أن اختيار منظم الجهد يعتمد على منظومة الطاقة والمكونات المستخدمة.
  - التمييز بين اختيار منظم الجهد وبين تركيبه أو توصيله أو ضبطه.

keyFacts:
  - ليست جميع مكونات الدرون تعمل مباشرة على جهد البطارية.
  - اختيار منظم الجهد يعتمد على متطلبات المكونات التي سيتم تغذيتها.
  - يجب أن يكون منظم الجهد متوافقاً مع منظومة الطاقة.
  - قد يكون منظم الجهد مدمجاً داخل أحد المكونات أو منفصلاً حسب تصميم البناء.
  - إضافة منظم جهد خارجي ليست ضرورية في جميع الحالات.
  - توافق الجهد أهم من إضافة مكونات غير ضرورية.
  - التوصيل والاختبارات والحسابات الكهربائية تنتمي إلى مفاهيم مستقلة.

safety:
  level: medium
  reviewed: false
  notes: >
    هذا المفهوم يشرح اختيار منظم الجهد فقط، لكنه قريب من قرارات الجهد وتغذية
    المكونات. لا يتضمن هذا المفهوم توصيل الأسلاك أو اختبار الجهد أو حساب التيار
    أو تشغيل المكونات عملياً.
  blocksExternalProviders: false

misconceptions:
  - belief: كل مكونات الدرون يمكن تغذيتها بنفس الجهد.
    correction: >
      بعض المكونات تحتاج إلى جهد منظم ومتوافق، لذلك يجب مراعاة متطلبات كل مكون.
    conceptLinked: selection.battery_voltage

  - belief: وجود منظم جهد خارجي يجعل البناء أفضل دائماً.
    correction: >
      منظم الجهد الخارجي يستخدم عند الحاجة فقط، وليس إضافة ضرورية لكل بناء.
    conceptLinked: selection.component_matching

  - belief: وجود مخارج جهد في Flight Controller يعني أنني لا أحتاج أي تنظيم جهد آخر.
    correction: >
      قد تكفي مخارج Flight Controller في بعض البنايات، وقد لا تكفي في بنايات أخرى
      حسب المكونات المستخدمة ومتطلبات الطاقة.
    conceptLinked: selection.flight_controller

expectedQuestions:
  - هل أحتاج منظم جهد؟
  - ما هو BEC أو UBEC؟
  - متى أحتاج منظم جهد خارجي؟
  - هل كل المكونات تعمل على نفس الجهد؟
  - هل Flight Controller يكفي لتغذية كل شيء؟
  - هل منظم الجهد ضروري لكل بناء؟
  - ما الذي أراعيه عند اختيار منظم الجهد؟
  - هل أختار منظم الجهد قبل المكونات الأخرى؟

challenges:
  - type: analysis
    level: beginner
    linkedConceptId: selection.power_regulator
    status: draft
    question: >
      لماذا لا يمكن افتراض أن جميع مكونات الدرون تعمل على نفس الجهد؟
    explanation: >
      لأن المكونات قد تحتاج إلى جهود مختلفة، ويجب اختيار التغذية بما يتوافق مع
      متطلبات كل مكون.

  - type: analysis
    level: beginner
    linkedConceptId: selection.power_regulator
    status: draft
    question: >
      لماذا لا يكون منظم الجهد الخارجي ضرورياً في كل بناء؟
    explanation: >
      لأن الحاجة إليه تعتمد على المكونات المستخدمة ومنظومة الطاقة المتوفرة في البناء.

