definition:
  text: >
    اختيار المكثف هو تحديد ما إذا كان البناء يحتاج إلى مكثف مناسب، واختيار
    مكثف يتوافق مع منظومة الطاقة ومتطلبات البناء.
  textEn: >
    Capacitor selection is deciding whether a build requires a capacitor and
    selecting one compatible with the power system and build requirements.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    لا يحتاج كل بناء إلى نفس نوع المكثف أو نفس الاعتبارات عند اختياره.
    يعتمد القرار على منظومة الطاقة وطبيعة البناء، لذلك يجب التفكير في
    التوافق مع بقية المكونات بدلاً من اختيار أي مكثف بشكل عشوائي.
  textEn: >
    Not every build requires the same capacitor or the same selection
    criteria. The decision depends on the power system and the build itself,
    so compatibility should be considered instead of choosing one randomly.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن اختيار المكثف قرار يعتمد على منظومة الطاقة.
  - إدراك أن المكثف يجب أن يكون متوافقاً مع بقية المكونات.
  - التمييز بين اختيار المكثف وبين تركيبه أو استخدامه.

keyFacts:
  - اختيار المكثف يعتمد على منظومة الطاقة.
  - يجب مراعاة توافق المكثف مع البطارية.
  - يجب مراعاة توافق المكثف مع ESC.
  - ليست جميع البنايات تحتاج نفس اختيار المكثف.
  - اختيار المكثف لا يعتمد على عامل واحد فقط.
  - تركيب المكثف مفهوم مستقل.
  - خصائص المكثف التفصيلية تنتمي إلى مفاهيم أخرى.

safety:
  level: low
  reviewed: false
  notes: >
    هذا المفهوم يقتصر على قرار اختيار المكثف، ولا يتضمن أي تعامل عملي معه.
  blocksExternalProviders: false

misconceptions:
  - belief: أي مكثف يصلح لأي بناء.
    correction: >
      يجب اختيار المكثف بما يتوافق مع منظومة الطاقة.
    conceptLinked: selection.component_matching

  - belief: المكثف الأكبر أفضل دائماً.
    correction: >
      لا يعتمد الاختيار على الحجم أو السعة فقط، وإنما على توافقه مع النظام.
    conceptLinked: selection.battery_voltage

  - belief: يمكن اختيار المكثف دون مراعاة ESC.
    correction: >
      يجب أن يكون المكثف متوافقاً مع بقية منظومة الطاقة.
    conceptLinked: selection.esc

expectedQuestions:
  - هل أحتاج إلى مكثف؟
  - كيف أختار مكثف الدرون؟
  - هل أي مكثف يعمل مع أي ESC؟
  - هل أي مكثف يعمل مع أي بطارية؟
  - هل المكثف الأكبر أفضل؟
  - متى أحتاج إلى مكثف؟
  - ما الذي أراعيه عند اختيار المكثف؟
  - هل تركيب المكثف إلزامي؟

