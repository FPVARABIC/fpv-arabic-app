  This is a selection concept about deciding whether and how to select a
  capacitor for an FPV build.
  It intentionally excludes capacitor theory, ESR, capacitance values,
  soldering, installation, placement, electrical analysis, testing,
  firmware configuration, and product reviews.
  Hardware explanation belongs in hardware.capacitor.
