architecturalNotes: |
  This is a selection concept about choosing LiPo battery C-rating.
  It intentionally excludes mathematical current calculations, charging,
  storage, battery testing, voltage sag measurement, connector replacement,
  and product recommendations.
  Battery theory belongs in power.lipo_battery, current behavior belongs in
  power.current_draw, and practical battery handling belongs in
  safety.lipo_handling.
