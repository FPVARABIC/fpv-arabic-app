definition:
  text: >
    اختيار معدل التفريغ C هو اختيار بطارية تستطيع توفير التيار الذي يحتاجه
    نظام الدفع بأمان، بما يتوافق مع المحركات والـ ESC وسعة البطارية وهدف البناء.
  textEn: >
    Battery C-rating selection is choosing a battery capable of supplying the
    current required by the propulsion system while remaining compatible with
    the motors, ESC, battery capacity, and build goal.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    قيمة C لا تعني أن البطارية تدوم مدة أطول، بل تعبر عن قدرتها على توفير
    التيار عند الحاجة. إذا كانت قدرة البطارية أقل من متطلبات النظام فقد يحدث
    هبوط في الجهد أو سخونة أو ضعف في الأداء. لذلك يجب اختيار C-Rating كجزء من
    النظام الكامل، وليس بالنظر إلى هذا الرقم وحده.
  textEn: >
    The C-rating does not indicate longer flight time. It describes the battery's
    ability to deliver current when required. If the battery cannot provide the
    required current, voltage sag, overheating, or reduced performance may occur.
    C-rating must therefore be selected as part of the complete system.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن C-Rating يصف قدرة البطارية على توفير التيار.
  - التمييز بين C-Rating وسعة البطارية وجهدها.
  - إدراك أن اختيار C-Rating يعتمد على متطلبات النظام بالكامل.

keyFacts:
  - C-Rating يعبر عن قدرة البطارية على توفير التيار، وليس عن كمية الطاقة المخزنة.
  - سعة البطارية وجهدها وC-Rating تمثل خصائص مختلفة ومتكاملة.
  - نظام الدفع الأقوى قد يحتاج بطارية تستطيع توفير تيار أعلى.
  - انخفاض قدرة البطارية على توفير التيار قد يؤدي إلى هبوط الجهد وضعف الأداء.
  - اختيار C-Rating يجب أن يراعي المحركات والـ ESC والمراوح والبطارية.
  - C-Rating المرتفع لا يعني تلقائيًا أن البطارية أفضل لكل استخدام.
  - اختيار البطارية يجب أن يعتمد على توافق النظام الكامل وليس على رقم C فقط.

safety:
  level: high
  reviewed: false
  notes: >
    هذا المفهوم يرتبط بقدرة البطارية على توفير التيار، وهو قرار قد يؤثر في
    سلامة النظام واستقراره الحراري. لا يتضمن هذا المفهوم اختبار البطاريات،
    أو قياس التيار، أو الشحن، أو التفريغ العملي. أي تطبيق عملي يجب أن يتم ضمن
    مفاهيم السلامة الخاصة ببطاريات LiPo.
  blocksExternalProviders: false

misconceptions:
  - belief: كلما زادت قيمة C كانت البطارية أفضل دائمًا.
    correction: >
      القيمة الأعلى ليست دائمًا أفضل، بل يجب أن تناسب احتياجات النظام الفعلية.
    conceptLinked: selection.component_matching

  - belief: C-Rating هو نفسه سعة البطارية.
    correction: >
      السعة تعبر عن كمية الطاقة، بينما C-Rating يعبر عن قدرة البطارية على
      توفير التيار.
    conceptLinked: selection.battery_capacity

  - belief: يمكن تجاهل C-Rating إذا كان الجهد مناسبًا.
    correction: >
      توافق الجهد وحده لا يكفي؛ يجب أن تستطيع البطارية توفير التيار المطلوب
      لنظام الدفع.
    conceptLinked: selection.battery_voltage

expectedQuestions:
  - ما معنى C-Rating؟
  - هل C الأعلى أفضل دائمًا؟
  - ما الفرق بين C وmAh؟
  - كيف أختار C-Rating المناسب؟
  - ماذا يحدث إذا كانت قيمة C منخفضة؟
  - هل C يؤثر في زمن الطيران؟
  - هل يمكن استخدام أي C مع نفس البطارية؟
  - ما علاقة C بالمحركات والـ ESC؟

challenges:
