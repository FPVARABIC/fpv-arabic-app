    level: beginner
    linkedConceptId: selection.battery_c_rating
    status: draft
    question: >
      لماذا لا تعني قيمة C الأعلى أن البطارية هي الخيار الأفضل دائمًا؟
    explanation: >
      لأن اختيار البطارية يعتمد على توافقها مع متطلبات النظام، وليس على أعلى
      قيمة C فقط.

  - type: analysis
    level: beginner
    linkedConceptId: selection.battery_c_rating
    status: draft
    question: >
      لماذا يجب النظر إلى C-Rating مع الجهد والسعة معًا؟
    explanation: >
      لأن البطارية يجب أن تحقق توافقًا في الجهد، والسعة، وقدرة توفير التيار،
      وليس في خاصية واحدة فقط.

