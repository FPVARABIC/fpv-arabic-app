definition:
  text: >
    ExpressLRS هو بروتوكول اتصال لاسلكي يستخدم لتبادل أوامر التحكم بين
    جهاز الإرسال والريسيفر.
  textEn: >
    ExpressLRS is a wireless radio-control protocol used to exchange
    control commands between a transmitter and a receiver.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    يحتاج جهاز الإرسال والريسيفر إلى لغة اتصال مشتركة حتى يتمكنا من
    تبادل أوامر التحكم. ExpressLRS هو أحد بروتوكولات الاتصال التي
    تحدد كيفية انتقال هذه الأوامر بين الجهازين.
  textEn: >
    A transmitter and receiver require a common communication protocol to
    exchange control commands. ExpressLRS is one such protocol, defining
    how those commands are transferred between the two devices.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن ExpressLRS بروتوكول اتصال وليس قطعة عتاد.
  - إدراك أن ExpressLRS يربط جهاز الإرسال بالريسيفر.
  - التمييز بين بروتوكول ExpressLRS وبين الريسيفر أو إعدادات الـ Firmware.

keyFacts:
  - ExpressLRS بروتوكول اتصال لاسلكي.
  - يعمل بين جهاز الإرسال والريسيفر.
  - ينقل أوامر التحكم بين الجهازين.
  - يدعم تبادل البيانات في الاتجاهين عند توفرها.
  - يختلف عن الريسيفر نفسه.
  - يختلف عن إعدادات الـ Firmware.
  - هذا المفهوم لا يشرح Bind أو Flash أو Configuration.

safety:
  level: low
  reviewed: false
  notes: >
    يشرح هذا المفهوم بروتوكول ExpressLRS كمفهوم نظري فقط، ولا يتضمن
    أي خطوات Bind أو Flash أو إعداد أو تشغيل عملي.
  blocksExternalProviders: false

misconceptions:
  - belief: ExpressLRS هو جهاز استقبال (Receiver).
    correction: >
      ExpressLRS ليس قطعة عتاد، بل بروتوكول اتصال يستخدم بين جهاز
      الإرسال والريسيفر.
    conceptLinked: selection.receiver

  - belief: ExpressLRS هو نفسه عملية Binding.
    correction: >
      Binding إجراء مستقل يربط جهاز الإرسال بالريسيفر، أما
      ExpressLRS فهو بروتوكول الاتصال المستخدم بينهما.
    conceptLinked: selection.receiver_protocol

  - belief: استخدام ExpressLRS يلغي الحاجة إلى إعدادات الـ Firmware.
    correction: >
      بروتوكول الاتصال يختلف عن إعدادات الـ Firmware، ولكل منهما
      مفاهيم مستقلة داخل النظام.
    conceptLinked: firmware.receiver_configuration

expectedQuestions:
  - ما هو ExpressLRS؟
  - لماذا يستخدم ExpressLRS؟
  - هل ExpressLRS هو نفسه الريسيفر؟
  - ما الفرق بين ExpressLRS وSBUS؟
  - هل يحتاج ExpressLRS إلى Binding؟
  - ما علاقة ExpressLRS بالـ Firmware؟
  - هل ExpressLRS ينقل أوامر التحكم فقط؟
  - لماذا يختار الكثيرون ExpressLRS؟

