definition:
  text: >
    SBUS هو بروتوكول اتصال تسلسلي يحدد كيفية نقل معلومات قنوات التحكم
    بين الريسيفر ومتحكم الطيران.
  textEn: >
    SBUS is a serial communication protocol that defines how control
    channel information is transferred between a receiver and a Flight
    Controller.
  source: authored
  reviewed: false
  level: beginner

beginnerExplanation:
  text: >
    عندما يحتاج الريسيفر إلى إرسال معلومات قنوات التحكم إلى متحكم
    الطيران، يستخدم بروتوكول اتصال يحدد طريقة انتقال هذه البيانات.
    SBUS هو أحد هذه البروتوكولات، ويحدد كيفية انتقال معلومات التحكم
    بين الريسيفر ومتحكم الطيران.
  textEn: >
    When a receiver needs to send control-channel information to the
    Flight Controller, it uses a communication protocol that defines how
    the data is transferred. SBUS is one such protocol.
  source: authored
  reviewed: false
  level: beginner

learningGoals:
  - فهم أن SBUS بروتوكول اتصال وليس قطعة عتاد.
  - إدراك أن SBUS يحدد طريقة انتقال معلومات التحكم بين الريسيفر ومتحكم الطيران.
  - التمييز بين بروتوكول SBUS وبين إعدادات الـ Firmware أو توصيل الأسلاك.

keyFacts:
  - SBUS بروتوكول اتصال تسلسلي.
  - يعمل بين الريسيفر ومتحكم الطيران.
  - ينقل معلومات قنوات التحكم بصيغة يفهمها متحكم الطيران.
  - يختلف عن الريسيفر نفسه.
  - يختلف عن إعدادات الـ Firmware.
  - يختلف عن توصيل الأسلاك.
  - هذا المفهوم لا يشرح خطوات الإعداد أو التوصيل أو Binding.

safety:
  level: low
  reviewed: false
  notes: >
    يشرح هذا المفهوم بروتوكول SBUS كمفهوم نظري فقط، ولا يتضمن أي
    خطوات إعداد أو توصيل أو تشغيل عملي.
  blocksExternalProviders: false

misconceptions:
  - belief: SBUS هو جهاز استقبال (Receiver).
    correction: >
      SBUS ليس قطعة عتاد، بل بروتوكول اتصال يحدد كيفية انتقال
      معلومات قنوات التحكم بين الريسيفر ومتحكم الطيران.
    conceptLinked: selection.receiver

  - belief: SBUS هو نفسه Serial RX.
    correction: >
      SBUS بروتوكول اتصال، أما Serial RX فهو إعداد داخل الـ Firmware
      يسمح لمتحكم الطيران باستقبال بيانات بعض بروتوكولات الاتصال
      التسلسلية.
    conceptLinked: firmware.receiver_configuration

  - belief: استخدام SBUS يلغي الحاجة إلى إعدادات الـ Firmware.
    correction: >
      بروتوكول الاتصال يختلف عن إعدادات الـ Firmware، ولكل منهما
      مفاهيم مستقلة داخل النظام.
    conceptLinked: firmware.receiver_configuration

expectedQuestions:
  - ما هو SBUS؟
  - لماذا يستخدم SBUS؟
  - هل SBUS هو نفسه الريسيفر؟
  - ما الفرق بين SBUS وExpressLRS؟
  - هل يحتاج SBUS إلى Binding؟
  - ما علاقة SBUS بالـ Firmware؟
  - هل SBUS ينقل أوامر التحكم فقط؟
  - لماذا ما زال SBUS مستخدماً؟

