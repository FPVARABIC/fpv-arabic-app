source:
  sourceType: authored
  sourceRef: control/sbus
  knowledgeOrigin: >
    Canonical control concept authored from SBUS receiver communication
    fundamentals and organized for AKL.
  extractionNotes: >
    This concept explains SBUS as a serial receiver communication protocol
    that defines how control-channel information is transferred between a
    receiver and a Flight Controller. It intentionally excludes receiver
    wiring, UART configuration, Serial RX setup, Betaflight or INAV
    configuration, troubleshooting, signal inversion details,
    product-specific implementations, and receiver binding procedures.

