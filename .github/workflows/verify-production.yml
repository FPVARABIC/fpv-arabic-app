# Eyes on the real deployment.
#
# Deployment is Vercel's job now (Git integration; see deploy.yml's header
# for why the CLI path was retired). What remains ours is the question that
# actually matters: what does a visitor get? This workflow answers it from a
# GitHub runner because the development container's egress policy refuses
# *.vercel.app, so the runner is the only place we can look from.
#
# It deploys nothing, needs no secret, and checks out nothing — it is curl
# and arithmetic. Dispatch it after a push builds, and read the log:
#
#   · the four public sections must answer 200
#   · /projects must reference all ten project covers
#   · each cover URL must itself serve 200
#
# It first WAITS (up to wait_minutes) for /projects to serve a page carrying
# the ten covers, because a Git-integration build takes a few minutes and
# the production alias flips only when the build is READY. A page that never
# starts serving the covers inside the window is a real failure and fails
# the job — with the per-path, per-image codes in the log saying what was
# actually served instead.

name: Verify production

# TWO TRIGGERS, ONE OF THEM SELF-SERVICE
# --------------------------------------
# `workflow_dispatch` only works for workflows that exist on the repository's
# DEFAULT branch — which is a stale branch this file is not on, so the API
# answers 404 to every dispatch. The push trigger below is the way around
# that: touching this file (the check counter at the bottom) and pushing runs
# the verification from THIS branch, no registration required. When the
# default branch ever moves to the web branch, dispatch starts working too
# and nothing here needs to change.
#
# verification run: 7 — the build section ships: wait for /build, then verify everything
# verification run: 8 — the quality pass ships: undecided-pref fix, mid-path edit fix, glossary help
on:
  push:
    branches: [claude/web-platform-foundation]
    paths: ['.github/workflows/verify-production.yml']
  workflow_dispatch:
    inputs:
      base:
        description: 'Base URL to verify'
        type: string
        required: false
        default: 'https://fpv-arabic-app.vercel.app'
      wait_minutes:
        description: 'Minutes to wait for the new build to start serving'
        type: string
        required: false
        default: '10'

jobs:
  verify:
    name: Check what is actually served
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the build, then verify
        run: |
          BASE="${{ inputs.base }}"
          # Push-triggered runs carry no inputs; the live deployment is the default.
          [ -z "$BASE" ] && BASE="https://fpv-arabic-app.vercel.app"
          BASE="${BASE%/}"
          echo "verifying against: $BASE"

          # Wait for the deployment to start serving the BUILD section — the
          # signature only the newest build can produce (the previous
          # signature, the ten covers, is already live and would satisfy the
          # wait instantly without proving anything about THIS deployment).
          WAIT_MIN="${{ inputs.wait_minutes }}"
          [ -z "$WAIT_MIN" ] && WAIT_MIN=6
          tries=$(( WAIT_MIN * 4 ))
          ready=0
          for i in $(seq 1 "$tries"); do
            marker=$(curl -s --max-time 20 "$BASE/build" \
              | grep -c 'build-mode-guided' || true)
            echo "attempt $i/$tries -> /build mode-cards marker: $marker"
            if [ "$marker" -ge 1 ]; then ready=1; break; fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "/build never started serving the wizard's doors within the window"
          fi

          fail=0
          # /community is deliberately ABSENT here: it is no longer a page.
          # Its redirect is asserted separately below.
          for p in / /build /build/wizard /projects /search /store; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p" || echo 000)
            echo "PATH $p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done

          # The retired community must answer with a TEMPORARY redirect to
          # /build — a 404 would mean broken old links, a 200 would mean the
          # section quietly came back.
          creds=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$BASE/community" || echo 000)
          echo "REDIRECT /community -> $creds"
          case "$creds" in
            30[78]\ *"/build") echo "  community redirect: correct" ;;
            *) echo "  community redirect: WRONG"; fail=1 ;;
          esac

          # The new navigation order, read from the served HTML itself.
          navsig=$(curl -sL --max-time 20 "$BASE/" \
            | grep -o 'data-testid="nav-[a-z]*"' | sed 's/.*nav-//; s/"//' | head -6 | paste -sd, -)
          echo "NAV order -> $navsig"
          if [ "$navsig" != "home,build,programming,kb,projects,store" ]; then fail=1; fi

          # The three doors of the build section, present on the landing.
          doors=$(curl -sL --max-time 20 "$BASE/build" | grep -o 'build-mode-[a-z]*' | sort -u | paste -sd, -)
          echo "BUILD doors -> $doors"
          if [ "$doors" != "build-mode-advanced,build-mode-guided,build-mode-parts" ]; then fail=1; fi

          covers=$(curl -s --max-time 20 "$BASE/projects" \
            | grep -o 'src="/assets/projects/[^"]*01-cover.webp"' | sort -u | wc -l || echo 0)
          echo "covers referenced on /projects: $covers/10"
          if [ "$covers" -lt 10 ]; then fail=1; fi

          ok=0
          for id in visual-target-tracking gps-denied-vio precision-landing-marker \
                    depth-obstacle-avoidance lidar-slam-mapping multi-drone-swarm \
                    autonomous-drone-racing crop-health-ndvi thermal-search-rescue \
                    esp32-mini-drone; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "$BASE/assets/projects/$id/01-cover.webp" || echo 000)
            echo "IMAGE $id -> $code"
            if [ "$code" = "200" ]; then ok=$((ok+1)); fi
          done
          echo "image URLs 200: $ok/10"
          if [ "$ok" -ne 10 ]; then fail=1; fi

          {
            echo "### Production verification"
            echo ""
            echo "Base: $BASE"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| four public paths 200 | $([ $fail -eq 0 ] && echo yes || echo see log) |"
            echo "| covers on /projects | $covers/10 |"
            echo "| cover URLs 200 | $ok/10 |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"
