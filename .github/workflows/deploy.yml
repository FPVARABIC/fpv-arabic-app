# Deploy FPVARABIC to production.
#
# WHAT THIS REMOVES FROM THE OWNER'S PLATE
# ----------------------------------------
# Everything except one secret, pasted once. After that, deployment is a
# consequence of merging — no dashboard, no build settings, no root-directory
# field, no framework dropdown. All of it is declared in `vercel.json` and
# here, in the repository, where it is reviewable and where it cannot silently
# differ from what was tested.
#
# SETUP — ONE TIME, ONE VALUE
# ---------------------------
#   1. https://vercel.com/account/tokens  →  create a token
#   2. This repo → Settings → Secrets and variables → Actions → New secret
#         Name:  VERCEL_TOKEN
#         Value: the token
#
# That is the whole setup. The first run creates the project, links it, and
# prints the live URL in the job summary.
#
# WHY THE TOKEN CANNOT BE COMMITTED
# ---------------------------------
# It authorises deployment to the account. A token in the repository is a
# token anyone with read access can deploy with — and, on a public repository,
# anyone at all. This is the one value that must come from the account holder.

name: Deploy

on:
  push:
    branches: [main, claude/web-platform-foundation]
  workflow_dispatch:
    inputs:
      production:
        description: 'Promote to the production domain'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Without the token this job would fail on every push and turn the repo's
    # checks red for a reason nobody can fix by changing code. Skipping when it
    # is absent means the workflow lies dormant until it is configured.
    if: ${{ github.repository_owner != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check for the deployment token
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment not configured yet"
              echo ""
              echo "Add a repository secret named \`VERCEL_TOKEN\` and re-run."
              echo "See \`DEPLOY.md\` for the two steps."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vercel CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install --global vercel@latest

      # RUN FROM THE REPOSITORY ROOT — «web» IS NAMED EXACTLY ONCE.
      #
      # These three steps used to run with `working-directory: web`, and the
      # project ALSO already knows the web app lives under `web/` — root
      # `vercel.json` says so (`buildCommand: cd web && …`, `outputDirectory:
      # web/.next`), and the linked project carries its own Root Directory,
      # which `vercel pull` fetches into `.vercel/project.json`. Two answers to
      # one question, and the CLI applied both:
      #
      #     ENOENT: no such file or directory, lstat
      #     …/fpv-arabic-app/web/web/.next/package.json
      #
      # `web/` from the shell, `web/` again from the project's own settings.
      # Nothing was wrong with either answer on its own — only with giving it
      # twice.
      #
      # So the shell stops answering. The CLI runs where the repository is, and
      # the single remaining source of «where is the web app» is the project
      # configuration the CLI already reads. That is also why this is the
      # correct half to drop: it works whether the linked project's Root
      # Directory is `web` (the CLI descends once) or unset (root
      # `vercel.json`'s buildCommand and outputDirectory do it once) — whereas
      # deleting the vercel.json keys instead would only work in the first case.
      #
      # The earlier note here claimed the root looks like a Vite app to the CLI.
      # `vercel.json` pins `"framework": "nextjs"`, so detection never gets a
      # vote.
      - name: Pull deployment settings
        if: steps.guard.outputs.configured == 'true'
        run: |
          vercel pull --yes \
            --environment=${{ inputs.production && 'production' || 'preview' }} \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # THE BUILD HAPPENS ON VERCEL'S MACHINES, NOT ON THIS RUNNER.
      #
      # This workflow used to `vercel build` here and upload the result with
      # `--prebuilt`. Both halves of that failed, each with receipts:
      #
      #   · the local build OOM'd at Node's default heap (run #40) and needed
      #     a 4096 MiB ceiling to pass at all;
      #   · the prebuilt UPLOAD then failed deterministically — hundreds of
      #     instant `Error: Upload aborted` retries, run after run, OOM at the
      #     default heap in #42 and a clean exit 1 at 4096 in #44. Measured,
      #     the payload was modest (~40 MB of traced function files, ~8 MB of
      #     static, no file near Vercel's 100 MB per-file cap), so the size
      #     was never the problem: the prebuilt-upload path itself was.
      #
      # Meanwhile the SAME app at the SAME shape has already built and served
      # green on Vercel's own infrastructure (deployment 9kwrSTVHw, Ready,
      # from 58c3255). So this step now hands Vercel the source — a measured
      # ~100 MB across ~1,100 tracked files, nothing over 4 MB — and lets it
      # build where it demonstrably succeeds, with its own memory and its own
      # build cache. The runner needs no npm install, no heap ceiling, and no
      # 272-page prerender; the whole failure surface of the last four runs is
      # simply no longer here.
      #
      # The CLI respects .gitignore when packaging source (there is no
      # .vercelignore, deliberately — a second ignore file REPLACES gitignore
      # semantics and would have to re-list node_modules, dist*, .next and
      # every other exclusion, and the first omission re-bloats the upload).
      # It waits until the deployment is READY and exits non-zero if the
      # remote build fails, so this step's status IS the deployment's status.
      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        id: deploy
        run: |
          status=0
          URL=$(vercel deploy ${{ inputs.production && '--prod' || '' }} \
                  --token="${{ secrets.VERCEL_TOKEN }}" 2>vercel-progress.log) || status=$?
          # The progress log carries the Inspect link and the remote build's
          # phases; surface its tail whether the deploy worked or not.
          grep -Ei 'inspect|queued|building|completing|error' vercel-progress.log | tail -30 || true
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### FPVARABIC deployed"
            echo ""
            echo "**URL:** $URL"
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Kind:** ${{ inputs.production && 'production' || 'preview' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # THE DEPLOYMENT IS NOT DONE UNTIL THE PAGES ANSWER.
      #
      # A READY deployment that serves the wrong build is exactly the failure
      # this project has already lived through once, so the workflow checks
      # what a visitor would actually get: the four public sections must
      # answer 200, the projects page must reference all ten covers, and each
      # cover file must itself be served. Production runs are checked on the
      # production domain — the URL people actually open — and preview runs on
      # the deployment's own URL.
      - name: Verify what is actually being served
        if: steps.guard.outputs.configured == 'true'
        run: |
          BASE='${{ inputs.production && 'https://fpv-arabic-app.vercel.app' || '' }}'
          [ -z "$BASE" ] && BASE="${{ steps.deploy.outputs.url }}"
          echo "verifying against: $BASE"

          # The alias flips atomically on completion; give the edge a moment.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/projects" || echo 000)
            if [ "$code" = "200" ]; then break; fi
            sleep 6
          done

          fail=0
          for p in / /community /projects /search; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$p" || echo 000)
            echo "PATH $p -> $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done

          covers=$(curl -s "$BASE/projects" \
            | grep -o 'src="/assets/projects/[^"]*01-cover.webp"' | sort -u | wc -l || echo 0)
          echo "covers referenced on /projects: $covers/10"
          if [ "$covers" -lt 10 ]; then fail=1; fi

          ok=0
          for id in visual-target-tracking gps-denied-vio precision-landing-marker \
                    depth-obstacle-avoidance lidar-slam-mapping multi-drone-swarm \
                    autonomous-drone-racing crop-health-ndvi thermal-search-rescue \
                    esp32-mini-drone; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/assets/projects/$id/01-cover.webp" || echo 000)
            echo "IMAGE $id -> $code"
            if [ "$code" = "200" ]; then ok=$((ok+1)); fi
          done
          echo "image URLs 200: $ok/10"
          if [ "$ok" -ne 10 ]; then fail=1; fi

          {
            echo "### Verification"
            echo ""
            echo "Base: $BASE · paths 200: $([ $fail -eq 0 ] && echo yes || echo NO) · covers on /projects: $covers/10 · image URLs 200: $ok/10"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
