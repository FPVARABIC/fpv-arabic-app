# Continuous verification for FPVARABIC.
#
# Runs on every push and pull request, needs no secrets, and is the gate that
# decides whether a commit is deployable. It exists because "it built on my
# machine" is not a claim anyone can check — this is.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The shared core lives in ../src and is imported by the web app, so both
      # manifests have to be installed before either surface can build.
      - name: Install (root — the shared core)
        run: npm ci

      - name: Install (web)
        run: npm ci --prefix web

      # `test:navigation-regression` drives a real browser. Playwright is a
      # dependency; the browser BINARY is not — npm installs the library, not
      # Chromium. Without this step every run on this repository failed with
      # «Failed to launch chromium because executable doesn't exist», before a
      # single assertion could be reported, and CI never reached the web build.
      - name: Install Chromium for the browser regression suite
        run: npx playwright install --with-deps chromium

      - name: Typecheck — phone app
        run: npx tsc -b --pretty false

      - name: Typecheck — web
        run: npm run web:typecheck

      - name: Lint — web
        run: npm --prefix web run lint

      # The platform's own suites. These are the ones that encode the rules a
      # build cannot check: catalogue provenance, role capabilities, the
      # identity parity between the two surfaces.
      - name: Test — shared core and web
        run: |
          npm run test:web-core
          npm run test:web-identity
          npm run test:web-project
          npm run test:web-software
          npm run test:retrieval
          npm run test:admin-roles
          npm run test:store
          npm run test:web-auth
          npm run test:web-community
          npm run test:platform-core
          npm run test:project
          npm run test:navigation-regression
          npm run test:nav-order
          npm run test:web-build
          # REACHABILITY IS A CATALOGUE PROPERTY, SO IT IS CHECKED ON EVERY
          # COMMIT, NOT ONLY WHEN THE BUILD SECTION'S CODE CHANGES.
          #
          # Two drone types shipped as offerable-but-impossible: one derived no
          # size at all, the other raised a blocker on all 1008 of its valid
          # combinations. Neither is a code bug — the code was correct and the
          # PARTS could not finish a build — so no amount of asserting the
          # section's structure would have caught them. This suite derives the
          # answer from the live catalogue, and fails in both directions: an
          # offered type that cannot be finished, and a withdrawn type that
          # quietly can.
          npm run test:build-reachability
          npm run test:build-phase0
          # ONE COMPATIBILITY TRUTH. The part card and the final report used to
          # evaluate the same physical rules separately, and `frame-size` was
          # enforced on the card while the report never read the declared size
          # at all. These three suites replace the ratchet that pinned that
          # defect: the characterization freezes the engine's existing output
          # so a refactor cannot change a severity in passing, the equivalence
          # suite proves both surfaces agree rule by rule, and the completeness
          # guard fails the build if a shared rule ever reaches only one of
          # them again.
          npm run test:compat-characterization
          npm run test:compat-equivalence
          npm run test:compat-completeness
          # THE RECOMMENDATION FOUNDATION. It decides compatibility too, so it is
          # a third consumer of the one shared truth above — and the guard that
          # keeps it honest runs on every commit, not only when it changes. Its
          # own suite exists because a recommender fails in ways that look like
          # success: «first one wins» and «the only option is the best option»
          # both read as recommendations until you check what backs them.
          npm run test:recommendation
          # THE ASSEMBLY SUITE, WHICH USED TO RUN NOWHERE.
          #
          # It asserts the phone's build surface and — the part that matters
          # here — that no second compatibility engine exists. That assertion
          # had been FAILING on the default branch since BUILD Phase 1 merged,
          # and nothing reported it, because this suite was in package.json and
          # in nobody's pipeline. A guard that runs nowhere is not a guard.
          #
          # Its one working-tree scope check reads `git status`, which is empty
          # after a CI checkout, so it is inert here and the other 207
          # assertions are not.
          npm run test:assembly
          npm run test:kb
          npm run test:lessons

      - name: Build — web (production)
        run: npm run web:build

      # The phone bundle is built too: the two surfaces share a core, so a
      # change that breaks the app is a change this repository must not ship.
      - name: Build — phone app
        run: npm run build
