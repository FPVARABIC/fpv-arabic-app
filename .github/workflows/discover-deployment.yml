# Find where Cloudflare actually deployed us.
#
# The development container's egress policy refuses *.workers.dev and the
# repository carries no wrangler config — the Cloudflare project lives
# entirely in its dashboard. But Cloudflare's Git integration reports every
# build back to GitHub, on the commit it built, and THOSE records a GitHub
# runner can read with its own token. This workflow deploys nothing and
# changes nothing: it walks the branch's recent commits and prints, for each,
# the check runs, commit statuses and deployment statuses — then extracts
# every *.workers.dev / *.pages.dev URL it finds, so the deployment's real
# address comes out of the platform's own records rather than a guess.

name: Discover deployment

# Push-triggered on its own file for the same reason verify-production.yml
# is: workflow_dispatch resolves against the repository's default branch,
# which is a stale branch this file is not on, so the API answers 404. Bump
# the run counter below and push to read the records again.
#
# discovery run: 4 — production vs alias, after the production-branch change
on:
  push:
    branches: [claude/web-platform-foundation]
    paths: ['.github/workflows/discover-deployment.yml']
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  deployments: read

jobs:
  discover:
    name: Read the platform's own build records
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect recent commits' checks, statuses and deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          auth="Authorization: Bearer $GH_TOKEN"
          api="https://api.github.com/repos/$REPO"
          found=/tmp/found-urls.txt
          : > "$found"

          shas=$(curl -sf -H "$auth" "$api/commits?sha=${{ github.ref_name }}&per_page=5" \
                  | jq -r '.[].sha')
          for sha in $shas; do
            echo "=== commit ${sha:0:7} ==="

            curl -sf -H "$auth" "$api/commits/$sha/check-runs?per_page=50" \
              | jq -r '.check_runs[] | "CHECK  \(.name) | \(.status)/\(.conclusion) | \(.details_url // "-") | \((.output.summary // "-") | gsub("[\\r\\n]+"; " ") | .[0:400])"' \
              | tee -a /tmp/all.txt || echo "  (check-runs unreadable)"

            # Cloudflare's check runs carry their build report in output
            # title/summary/text — print those IN FULL, because the tail of a
            # failed build is exactly what cannot be read from anywhere else.
            curl -sf -H "$auth" "$api/commits/$sha/check-runs?per_page=50" \
              | jq -r '.check_runs[] | select(.name | test("cloudflare|workers"; "i"))
                  | "----- FULL OUTPUT: \(.name) [\(.status)/\(.conclusion)] -----",
                    "title: \(.output.title // "-")",
                    "summary:", (.output.summary // "-"),
                    "text:", (.output.text // "-"),
                    "-----"' \
              | tee -a /tmp/all.txt || true

            curl -sf -H "$auth" "$api/commits/$sha/status" \
              | jq -r '.statuses[]? | "STATUS \(.context) | \(.state) | \(.target_url // "-") | \(.description // "-")"' \
              | tee -a /tmp/all.txt || echo "  (statuses unreadable)"

            deps=$(curl -sf -H "$auth" "$api/deployments?sha=$sha&per_page=10" | jq -r '.[].id') || deps=""
            for d in $deps; do
              curl -sf -H "$auth" "$api/deployments/$d/statuses?per_page=5" \
                | jq -r '.[] | "DEPLOY \(.state) | \(.environment_url // "-") | \(.target_url // "-")"' \
                | tee -a /tmp/all.txt || true
            done
            echo
          done

          grep -oE 'https://[A-Za-z0-9.-]+\.(workers|pages)\.dev[^" |]*' /tmp/all.txt \
            | sort -u | tee "$found" || true

          echo
          if [ -s "$found" ]; then
            echo "== deployment URLs found =="
            cat "$found"
          else
            echo "== no *.workers.dev / *.pages.dev URL in any record of the last 5 commits =="
            echo "   (either Cloudflare is building a different branch, or it posts no URL back)"
          fi

      # WHICH APP EACH VERCEL SURFACE IS ACTUALLY SERVING.
      #
      # The question «why are the images missing on Vercel» cannot be answered
      # from build records alone, because Vercel has TWO surfaces here: the
      # production domain (whatever the project's Production Branch last
      # built) and the branch alias (the newest preview of the web branch).
      # This step fingerprints both: HTTP codes, which application answers
      # (the Next platform renders project-card test ids; the old Vite shell
      # renders an empty #root div), how many covers /projects references,
      # and whether a cover file itself is served.
      - name: Probe the Vercel surfaces
        run: |
          probe() {
            BASE="$1"; LABEL="$2"
            echo "──── $LABEL — $BASE"
            for p in / /projects /community /search; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$p" || echo 000)
              echo "  PATH $p -> $code"
            done
            html=$(curl -sL --max-time 20 "$BASE/projects" || true)
            covers=$(printf '%s' "$html" | grep -o 'src="/assets/projects/[^"]*01-cover.webp"' | sort -u | wc -l)
            cards=$(printf '%s' "$html" | grep -c 'data-testid="project-card-' || true)
            vite=$(curl -sL --max-time 20 "$BASE/" | grep -c 'id="root"' || true)
            echo "  identity: project cards=$cards · covers referenced=$covers/10 · vite-root-div=$vite"
            img=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 \
              "$BASE/assets/projects/visual-target-tracking/01-cover.webp" || echo 000)
            echo "  sample cover URL -> $img"
          }
          probe "https://fpv-arabic-app.vercel.app" "PRODUCTION domain"
          probe "https://fpv-arabic-app-git-claude-web-platform-foundation-fpv-arabic.vercel.app" "BRANCH alias (newest preview)"
