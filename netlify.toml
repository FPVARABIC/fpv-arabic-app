# FPVARABIC — Netlify
#
# WHY THIS FILE EXISTS AT ALL, WHEN THE SETTINGS ARE ALREADY IN THE UI
# --------------------------------------------------------------------
# Because the UI settings alone produce a build that fails, and it fails on the
# one pillar that was called mandatory.
#
# `Base directory: web` tells Netlify to install `web/package.json` and nothing
# else. But `firebase` — the client SDK — is DELIBERATELY absent from that
# manifest. It lives in the repository root's, and both the web app and the
# shared community core resolve it by walking up to the root `node_modules`.
# `web/next.config.ts` explains at length why it must stay that way: a second
# copy under `web/node_modules` is mutually unintelligible with the first, so a
# Storage handle built by one is unrecognisable to the other and the first
# photo upload throws "Cannot read properties of undefined (reading 'path')" —
# after typecheck, lint and `next build` have all passed.
#
# Netlify never creates that root `node_modules`, because nothing told it to.
# Verified by hiding the root directory and asking Node to resolve:
#
#     firebase/app                 MISSING
#     firebase/auth                MISSING
#     firebase/firestore           MISSING
#     browser-image-compression    MISSING
#     next, react                  resolve (they are in web/package.json)
#
# Those four are imported by `web/components/auth/SignInForm.tsx`,
# `web/lib/communityWrites.ts`, `web/lib/firebaseClient.ts` and the whole of
# `src/components/Community/` — sign-in, posting, comments, media. So the build
# breaks precisely at the community, while the static pages would have been
# fine. That is the failure this file prevents.
#
# A `netlify.toml` in the repository root overrides the UI panel, so the values
# below are the ones that take effect. They are the UI's own settings plus the
# root install.

[build]
  # Same as the UI: the Next app is the deployment.
  base = "web"

  # Netlify installs `web/package.json` on its own before this runs. This adds
  # the root install that nothing else would do. The subshell keeps the
  # directory change from leaking into `npm run build`, which must run in
  # `web/` so Next finds its own config.
  command = "(cd .. && npm ci --no-audit --no-fund) && npm run build"

  # Relative to `base`. The Next runtime plugin reads the build output here and
  # turns the server-rendered half into functions.
  publish = ".next"

[build.environment]
  # Next 16 requires Node 20+. Pinned so a change to Netlify's default cannot
  # move the build under us.
  NODE_VERSION = "22"

  # ── The staging switches, kept OUT of the env-var panel on purpose ────────
  # Neither is a secret, and both decide whether this deployment behaves as a
  # trial copy. In the panel they are two things to remember and one thing to
  # get wrong; here they are reviewable in the diff.
  #
  # STAGING=true turns on the «نسخة تجريبية» badge and the site-wide
  # `X-Robots-Tag: noindex, nofollow, noarchive`, and makes
  # `isCanonicalOrigin()` answer «no» so robots.txt disallows every crawler.
  STAGING = "true"

  # Named explicitly rather than left to a default, so a future change to that
  # default cannot quietly point this deployment at a different provider.
  # There is NO MOLLIE_API_KEY anywhere — that absence IS the off switch:
  # `paymentProvider()` returns null, the basket and the order form keep
  # working, and the pay step says «الدفع غير مفعّل».
  PAYMENT_PROVIDER = "mollie"

  # ── Netlify's secrets scanner ────────────────────────────────────────────
  # It fails a build when an environment variable's VALUE appears in the build
  # output. Six of ours are supposed to appear there: `NEXT_PUBLIC_*` is the
  # prefix that means «compile this into the browser bundle», and Firebase's
  # web config is public by design — access is controlled by firestore.rules
  # and storage.rules, not by hiding an API key that every visitor's browser
  # must have in order to connect at all.
  #
  # Only these six are exempted, and they are listed one by one. A wildcard
  # would also exempt FIREBASE_PRIVATE_KEY, which is the exact thing the
  # scanner exists to catch.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"

# The Next.js runtime. Netlify usually detects Next and adds this itself;
# declaring it makes the behaviour the same on every build rather than
# dependent on detection. It is what turns the 26 `force-dynamic` pages, the
# server actions behind checkout and the payment webhook route into functions.
# Without it Netlify publishes `.next` as static files and every interactive
# part of the site — sign-in, posting, commenting, the admin panel — 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers here are a SECOND layer, not the only one. `next.config.ts` sets the
# same security headers, and they survive `next start`, the App Hosting
# deployment and local review — none of which read this file. The duplication
# is deliberate: whichever host serves the site, the headers are present.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
