ext {
    // 24 (Android 7.0), Capacitor's own default — NOT lowered. An earlier
    // version of this project tried lowering it to 22 for broader device
    // reach, but that build actively fails: org.apache.cordova:framework's
    // 14.0.1 AAR (see cordovaAndroidVersion below), a transitive dependency
    // pulled in regardless of whether any Cordova plugin is actually used,
    // itself declares minSdkVersion 24 — Gradle's manifest merger rejects
    // any app minSdk lower than a dependency's own minSdk, so this floor
    // isn't a device-compatibility choice this project gets to make; it's a
    // hard constraint from a dependency already in the build graph.
    // compileSdkVersion/targetSdkVersion are left at Capacitor's own current
    // default (36) — those govern the BUILD toolchain/API surface, not
    // runtime device compatibility, so lowering them would gain nothing and
    // would be actively wrong per Play Store's own target API level
    // requirements for new app submissions.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}